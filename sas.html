<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS 焦虑自评量表 - 心灵驿站</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* SAS 独有样式 */
        .progress-section .reverse-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="back-link" aria-label="返回量表目录">← 目录</a>
            <div class="scale-label">
                SAS 焦虑自评量表
                <small>Self-Rating Anxiety Scale</small>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>😰 SAS 焦虑自评量表</h1>
            <p class="subtitle">评估最近一周的焦虑情绪 · 共20题 · 约4-6分钟</p>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-info">
                <span>请根据最近一周的实际感受作答</span>
                <span id="answeredCount">已答 0 题</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%;"></div>
            </div>
            <div class="reverse-hint">
                ⚡ 标注 <span class="reverse-badge">反向</span> 的题目计分方式与其它题目相反
            </div>
        </div>

        <div class="questions-card" id="questionsCard"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="nav-btn clear-btn" id="btnClear">🔄 清空全部答案</button>
            <button class="nav-btn submit-btn" id="btnSubmit" disabled>✅ 提交答卷 · 查看结果</button>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>📊 测评结果报告</h2>
                <span class="result-date" id="resultDate"></span>
            </div>
            <div class="result-summary" id="resultSummary"></div>
            <div id="resultLevelContainer"></div>
            <div id="crisisAlertContainer"></div>
            <div class="disclaimer">
                <span class="disclaimer-icon">⚠️</span>
                <span><strong>重要提醒：</strong>本量表为自我筛查工具，结果仅供自我参考，<strong>不能替代专业心理医生的诊断</strong>。如果你感到持续的紧张不安，请咨询专业医生或拨打心理援助热线 <strong>12320-5</strong>。</span>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <button class="nav-btn" id="btnRetake">🔄 重新测评</button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <a href="index.html">← 返回量表目录</a> · 心灵驿站 - 心理测评中心
    </footer>

    <script src="common.js"></script>
    <script>
        (function() {
            var questions = [
                { id: 1,  text: '我觉得比平常容易紧张和着急', reversed: false },
                { id: 2,  text: '我无缘无故地感到害怕', reversed: false },
                { id: 3,  text: '我容易心里烦乱或觉得惊恐', reversed: false },
                { id: 4,  text: '我觉得我可能将要发疯', reversed: false },
                { id: 5,  text: '我觉得一切都很好，也不会发生什么不幸', reversed: true },
                { id: 6,  text: '我手脚发抖打颤', reversed: false },
                { id: 7,  text: '我因为头痛、颈痛和背痛而苦恼', reversed: false },
                { id: 8,  text: '我感觉容易衰弱和疲乏', reversed: false },
                { id: 9,  text: '我觉得心平气和，并且容易安静坐着', reversed: true },
                { id: 10, text: '我觉得心跳得很快', reversed: false },
                { id: 11, text: '我因为一阵阵头晕而苦恼', reversed: false },
                { id: 12, text: '我有晕倒发作，或觉得要晕倒似的', reversed: false },
                { id: 13, text: '我吸气呼气都感到很容易', reversed: true },
                { id: 14, text: '我的手脚麻木和刺痛', reversed: false },
                { id: 15, text: '我因为胃痛和消化不良而苦恼', reversed: false },
                { id: 16, text: '我常常要小便', reversed: false },
                { id: 17, text: '我的手脚常常是干燥温暖的', reversed: true },
                { id: 18, text: '我脸红发热', reversed: false },
                { id: 19, text: '我容易入睡并且一夜睡得很好', reversed: true },
                { id: 20, text: '我做恶梦', reversed: false }
            ];

            var options = [
                { label: '没有或很少时间', short: '很少', scoreForward: 1 },
                { label: '少部分时间', short: '有时', scoreForward: 2 },
                { label: '相当多时间', short: '经常', scoreForward: 3 },
                { label: '绝大部分或全部时间', short: '总是', scoreForward: 4 }
            ];

            var engine = new ScaleEngine({
                questions: questions,
                options: options,
                storageKey: 'sas_answers',
                scaleName: 'SAS 焦虑自评量表',
                onSubmit: function(eng) {
                    var rawScore = 0;
                    eng.questions.forEach(function(q) {
                        rawScore += eng.getScore(q, eng.answers[q.id]);
                    });
                    var standardScore = Math.round(rawScore * 1.25);

                    var levelText, levelClass;
                    if (standardScore < 50) {
                        levelText = '正常范围';
                        levelClass = 'normal';
                    } else if (standardScore <= 59) {
                        levelText = '轻度焦虑';
                        levelClass = 'mild';
                    } else if (standardScore <= 69) {
                        levelText = '中度焦虑';
                        levelClass = 'moderate';
                    } else {
                        levelText = '重度焦虑';
                        levelClass = 'severe';
                    }

                    var warning = standardScore >= 50;
                    eng.resultSummary.innerHTML =
                        '<div class="result-stat ' + (warning ? 'warning' : '') + '">' +
                            '<div class="stat-val">' + rawScore + '</div>' +
                            '<div class="stat-lbl">原始总分 (20-80)</div>' +
                        '</div>' +
                        '<div class="result-stat ' + (warning ? 'warning' : '') + '">' +
                            '<div class="stat-val">' + standardScore + '</div>' +
                            '<div class="stat-lbl">标准分 (原始分×1.25)</div>' +
                        '</div>';

                    eng.resultLevelContainer.innerHTML =
                        '<div class="result-level ' + levelClass + '">' + levelText + '</div>';

                    // 危机预警：第4题（可能发疯）或第12题（晕倒）得分较高
                    var q4 = eng.answers[4] || 0;
                    var q12 = eng.answers[12] || 0;
                    var crisisHTML = '';
                    if (q4 >= 3 || q12 >= 3) {
                        crisisHTML =
                            '<div class="crisis-alert">' +
                                '<span class="crisis-icon">⚠️</span>' +
                                '<div>' +
                                    '<strong>请留意：</strong>你在"害怕发疯"或"晕倒感"相关题目上得分较高，这可能是焦虑的常见表现。建议你关注自己的情绪状态，若症状持续并影响生活，请寻求专业帮助。<br>' +
                                    '📞 <strong>全国心理援助热线：12320-5</strong>' +
                                '</div>' +
                            '</div>';
                    }
                    eng.crisisAlertContainer.innerHTML = crisisHTML;

                    eng.lockAnswerArea();
                    eng.showResults();
                }
            });

            engine.init();
        })();
    </script>
</body>
</html>
