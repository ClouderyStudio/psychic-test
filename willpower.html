<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>意志力测试 - 心灵驿站</title>
    <style>
        :root {
            --bg: #f7f4f0;
            --card-bg: #ffffff;
            --text: #3a3540;
            --text-secondary: #6b6372;
            --text-muted: #9a919e;
            --primary: #5e8c6f;
            --primary-light: #eaf5ef;
            --primary-dark: #3d6a4f;
            --accent: #c97d60;
            --accent-light: #fdf2ed;
            --danger: #c0392b;
            --danger-light: #fdecea;
            --warm: #d4a843;
            --warm-light: #fef9f0;
            --shadow-sm: 0 1px 3px rgba(58, 53, 64, 0.05), 0 1px 2px rgba(58, 53, 64, 0.04);
            --shadow-md: 0 4px 16px rgba(58, 53, 64, 0.07), 0 2px 6px rgba(58, 53, 64, 0.04);
            --shadow-lg: 0 8px 30px rgba(58, 53, 64, 0.10), 0 3px 10px rgba(58, 53, 64, 0.05);
            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system,
                sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 15% 10%, rgba(94, 140, 111, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 90%, rgba(94, 140, 111, 0.03) 0%, transparent 55%);
            background-attachment: fixed;
        }
        .top-bar {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(58, 53, 64, 0.06);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-bar-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 7px 14px;
            border-radius: 20px;
            transition: var(--transition);
            background: var(--primary-light);
            white-space: nowrap;
        }
        .back-link:hover {
            background: #d4e8d9;
            color: #2d5a40;
        }
        .scale-label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            text-align: right;
            letter-spacing: 0.02em;
            line-height: 1.3;
        }
        .scale-label small {
            display: block;
            font-weight: 400;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .page-header {
            text-align: center;
            padding: 32px 0 20px;
        }
        .page-header h1 {
            font-size: clamp(1.3rem, 2.5vw, 1.7rem);
            font-weight: 700;
            color: #2c2633;
            margin-bottom: 6px;
        }
        .page-header .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .progress-section {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(58, 53, 64, 0.05);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .progress-bar-outer {
            width: 100%;
            height: 8px;
            background: #e8e3ec;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #5e8c6f 0%, #7baf90 100%);
            border-radius: 10px;
            transition: width 0.35s ease;
            width: 0%;
        }
        .questions-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px 24px 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(58, 53, 64, 0.05);
            margin-bottom: 16px;
        }
        .question-item {
            padding: 14px 0;
            border-bottom: 1px solid #f0edf3;
            transition: var(--transition);
        }
        .question-item:last-child {
            border-bottom: none;
        }
        .question-item.answered {
            background: #fdfcfe;
            margin: 0 -16px;
            padding-left: 16px;
            padding-right: 16px;
            border-radius: 8px;
        }
        .question-num {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 0.72rem;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .question-text {
            font-weight: 500;
            font-size: 0.92rem;
            color: #2c2633;
            display: inline;
            letter-spacing: 0.02em;
            line-height: 1.5;
        }
        .reverse-badge {
            display: inline-block;
            background: #f2eef6;
            color: #7b6b8e;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 5px;
            vertical-align: middle;
        }
        .options-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .option-btn {
            flex: 1;
            min-width: 62px;
            padding: 9px 4px;
            border-radius: 20px;
            border: 1.5px solid #e0dbe4;
            background: #fff;
            cursor: pointer;
            font-size: 0.73rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            text-align: center;
            font-family: var(--font-sans);
            letter-spacing: 0.02em;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .option-btn:hover {
            border-color: #c5bdd0;
            background: #faf9fb;
            color: var(--text);
        }
        .option-btn.selected {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            font-weight: 600;
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .option-score {
            display: block;
            font-size: 0.58rem;
            font-weight: 400;
            opacity: 0.7;
            letter-spacing: 0.03em;
        }
        .option-btn.selected .option-score {
            opacity: 1;
        }
        .nav-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 12px 28px;
            border-radius: 24px;
            border: 1.5px solid #d8d2de;
            background: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            transition: var(--transition);
            font-family: var(--font-sans);
            letter-spacing: 0.03em;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn:hover:not(:disabled) {
            border-color: #b8b0c0;
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f5f3f7;
        }
        .nav-btn.submit-btn {
            background: #3d5a4f;
            color: #fff;
            border-color: #3d5a4f;
            font-size: 0.95rem;
            padding: 14px 36px;
            letter-spacing: 0.04em;
        }
        .nav-btn.submit-btn:hover:not(:disabled) {
            background: #2f4840;
            border-color: #2f4840;
            box-shadow: var(--shadow-lg);
        }
        .nav-btn.clear-btn {
            color: var(--danger);
            border-color: #e8c8c0;
        }
        .nav-btn.clear-btn:hover:not(:disabled) {
            background: var(--danger-light);
            border-color: #d4a098;
        }
        .results-section {
            display: none;
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 28px 24px 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(58, 53, 64, 0.06);
            margin-bottom: 32px;
        }
        .results-section.visible {
            display: block;
            animation: fadeInUp 0.45s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .results-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .results-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c2633;
            letter-spacing: 0.02em;
        }
        .results-header .result-date {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .result-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .result-stat {
            background: #faf8fc;
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            border: 1px solid #eeeaf2;
        }
        .result-stat .stat-val {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .result-stat .stat-lbl {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.03em;
        }
        .result-stat.warning .stat-val {
            color: var(--accent);
        }
        .result-stat.danger-stat .stat-val {
            color: var(--danger);
        }
        .result-level {
            text-align: center;
            margin: 16px 0;
            padding: 18px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.03em;
        }
        .result-level.strong {
            background: #e6f4ea;
            color: #3d6a4f;
        }
        .result-level.good {
            background: #eaf5ef;
            color: #2d5a40;
        }
        .result-level.moderate {
            background: #fef6e6;
            color: #8b6919;
        }
        .result-level.weak {
            background: #fef0ea;
            color: #8b3d1f;
        }
        .result-level.very-weak {
            background: #fdecea;
            color: #8b1a1a;
        }
        .result-desc {
            background: #faf8fc;
            border-radius: var(--radius);
            padding: 18px;
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text);
            margin: 16px 0;
            border: 1px solid #eeeaf2;
        }
        .result-tips {
            background: #fef9f0;
            border-radius: var(--radius);
            padding: 16px;
            font-size: 0.85rem;
            line-height: 1.7;
            color: #6b4f20;
            margin: 12px 0;
            border: 1px solid #f0d89c;
        }
        .result-tips strong {
            color: #4a3510;
        }
        .disclaimer {
            background: var(--warm-light);
            border: 1px solid #f0d89c;
            border-radius: var(--radius);
            padding: 14px 18px;
            font-size: 0.82rem;
            color: #8b6d3b;
            line-height: 1.6;
            margin-top: 16px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .disclaimer-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .footer {
            text-align: center;
            padding: 20px 20px 36px;
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.7;
            border-top: 1px solid rgba(58, 53, 64, 0.05);
        }
        .footer a {
            color: var(--primary-dark);
            text-decoration: none;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #3a3540;
            color: #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: var(--shadow-lg);
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(4px);
        }
        @media (max-width: 600px) {
            .questions-card {
                padding: 14px 10px 8px;
            }
            .question-item {
                padding: 9px 0;
            }
            .question-text {
                font-size: 0.82rem;
            }
            .option-btn {
                padding: 7px 3px;
                font-size: 0.68rem;
                min-width: 48px;
                border-radius: 16px;
            }
            .option-score {
                font-size: 0.55rem;
            }
            .options-row {
                gap: 4px;
            }
            .nav-btn {
                padding: 10px 18px;
                font-size: 0.82rem;
            }
            .result-summary {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .result-stat {
                padding: 12px 8px;
            }
            .result-stat .stat-val {
                font-size: 1.4rem;
            }
            .top-bar-inner {
                padding: 0 10px;
                gap: 8px;
            }
            .back-link {
                font-size: 0.78rem;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="back-link" aria-label="返回量表目录">← 目录</a>
            <div class="scale-label">
                意志力测试
                <small>Willpower Assessment</small>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>💪 意志力测试</h1>
            <p class="subtitle">评估你的自控力与坚持能力 · 共20题 · 约3-5分钟</p>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-info">
                <span>请根据你的实际情况，选择最符合的一项</span>
                <span id="answeredCount">已答 0 题</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%;"></div>
            </div>
            <div style="font-size:0.68rem;color:var(--text-muted);margin-top:6px;">
                ⚡ 标注 <span class="reverse-badge">反向</span> 的题目计分方式与其他题目相反
            </div>
        </div>

        <div class="questions-card" id="questionsCard"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="nav-btn clear-btn" id="btnClear">🔄 清空全部答案</button>
            <button class="nav-btn submit-btn" id="btnSubmit" disabled>✅ 提交答卷 · 查看结果</button>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>💎 意志力测评结果</h2>
                <span class="result-date" id="resultDate"></span>
            </div>
            <div class="result-summary" id="resultSummary"></div>
            <div id="resultLevelContainer"></div>
            <div class="result-desc" id="resultDesc"></div>
            <div class="result-tips" id="resultTips"></div>
            <div class="disclaimer">
                <span class="disclaimer-icon">⚠️</span>
                <span><strong>重要提醒：</strong>本测试为意志力自评工具，结果仅供自我了解和参考。意志力是可以通过训练提升的，<strong>分数不理想不代表无法改变</strong>。如果你在自控方面持续感到困难并影响生活，建议寻求专业心理帮助。</span>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <button class="nav-btn" id="btnRetake">🔄 重新测评</button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <a href="index.html">← 返回量表目录</a> · 心灵驿站 - 心理测评中心
    </footer>

    <script>
        (function() {
            // 意志力测试题目 (20题)
            const questions = [
                { id: 1, text: '我能抗拒诱惑，坚持完成该做的事情', reverse: false },
                { id: 2, text: '做事情时，我常常半途而废', reverse: true },
                { id: 3, text: '一旦设定了目标，我就会努力去实现它', reverse: false },
                { id: 4, text: '我常常把今天该做的事情推到明天', reverse: true },
                { id: 5, text: '即使面对枯燥的任务，我也能坚持完成', reverse: false },
                { id: 6, text: '心情不好时，我就会放弃手头的事情', reverse: true },
                { id: 7, text: '在嘈杂的环境中我也能专心做事', reverse: false },
                { id: 8, text: '我的计划常常被一时的冲动打乱', reverse: true },
                { id: 9, text: '为了长远的目标，我可以忍受短期的辛苦', reverse: false },
                { id: 10, text: '碰到困难时，我很容易选择放弃', reverse: true },
                { id: 11, text: '我能够严格遵守自己制定的规则', reverse: false },
                { id: 12, text: '看到美食时我很难控制自己的食欲', reverse: true },
                { id: 13, text: '即使没有人监督，我也能自觉完成任务', reverse: false },
                { id: 14, text: '我经常因为刷手机或娱乐而耽误正事', reverse: true },
                { id: 15, text: '失败后我能很快振作起来继续努力', reverse: false },
                { id: 16, text: '我在做决定后常常会后悔和动摇', reverse: true },
                { id: 17, text: '我能够长时间专注于一件事情', reverse: false },
                { id: 18, text: '遇到反对意见时，我很容易改变自己的立场', reverse: true },
                { id: 19, text: '我相信通过坚持可以实现自己设定的目标', reverse: false },
                { id: 20, text: '我的生活缺乏规律，经常随心所欲', reverse: true },
            ];

            // 选项：1-完全不符合 到 5-完全符合
            const options = [
                { value: 1, label: '完全不符合', short: '完全不符' },
                { value: 2, label: '比较不符合', short: '不太符合' },
                { value: 3, label: '一般', short: '一般' },
                { value: 4, label: '比较符合', short: '比较符合' },
                { value: 5, label: '完全符合', short: '完全符合' },
            ];

            // 状态管理
            let answers = {}; // { questionId: selectedValue (1-5) }
            const saved = localStorage.getItem('willpower_answers');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === 'object') answers = parsed;
                } catch (e) { answers = {}; }
            }

            const questionsCard = document.getElementById('questionsCard');
            const progressBar = document.getElementById('progressBar');
            const answeredCountEl = document.getElementById('answeredCount');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnClear = document.getElementById('btnClear');
            const navButtons = document.getElementById('navButtons');
            const resultsSection = document.getElementById('resultsSection');
            const resultSummary = document.getElementById('resultSummary');
            const resultLevelContainer = document.getElementById('resultLevelContainer');
            const resultDesc = document.getElementById('resultDesc');
            const resultTips = document.getElementById('resultTips');
            const resultDate = document.getElementById('resultDate');
            const btnRetake = document.getElementById('btnRetake');
            const toast = document.getElementById('toast');
            const progressSection = document.getElementById('progressSection');

            let toastTimer;

            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function saveAnswers() {
                localStorage.setItem('willpower_answers', JSON.stringify(answers));
            }

            // 计算实际得分（考虑反向计分）
            function getRealScore(q, selectedValue) {
                if (q.reverse) {
                    return 6 - selectedValue; // 反向：选1得5，选5得1
                }
                return selectedValue;
            }

            function renderQuestions() {
                let html = '';
                questions.forEach(q => {
                    const selectedValue = answers[q.id];
                    const isAnswered = selectedValue !== undefined;
                    const answeredClass = isAnswered ? ' answered' : '';
                    const reverseBadge = q.reverse ?
                        '<span class="reverse-badge">反向</span>' : '';
                    html += `<div class="question-item${answeredClass}">`;
                    html +=
                        `<span class="question-num">${q.id}</span><span class="question-text">${q.text}${reverseBadge}</span>`;
                    html += `<div class="options-row">`;
                    options.forEach(opt => {
                        const selClass = (isAnswered && selectedValue === opt.value) ?
                            ' selected' : '';
                        html +=
                            `<button class="option-btn${selClass}" data-score="${opt.value}" data-qid="${q.id}" aria-label="${opt.label}">
                                    ${opt.short}<span class="option-score">${opt.label}</span></button>`;
                    });
                    html += `</div></div>`;
                });
                questionsCard.innerHTML = html;

                questionsCard.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const qid = parseInt(this.getAttribute('data-qid'));
                        const score = parseInt(this.getAttribute('data-score'));
                        if (answers[qid] === score) {
                            delete answers[qid];
                        } else {
                            answers[qid] = score;
                        }
                        saveAnswers();
                        renderQuestions();
                        updateProgress();
                    });
                });
                updateProgress();
            }

            function updateProgress() {
                const total = questions.length;
                const answered = Object.keys(answers).length;
                const pct = Math.round((answered / total) * 100);
                progressBar.style.width = pct + '%';
                answeredCountEl.textContent = `已答 ${answered} 题`;
                btnSubmit.disabled = answered < total;
            }

            function clearAll() {
                if (Object.keys(answers).length === 0) {
                    showToast('暂无已选答案');
                    return;
                }
                if (confirm('确定要清空全部已选答案吗？此操作不可恢复。')) {
                    answers = {};
                    saveAnswers();
                    renderQuestions();
                    updateProgress();
                    showToast('已清空全部答案');
                }
            }

            function calcLevel(totalRealScore) {
                const maxScore = questions.length * 5; // 100
                const pct = totalRealScore / maxScore * 100;
                if (pct >= 85) return {
                    class: 'strong',
                    text: '意志力非常坚强',
                    desc: '你拥有出色的意志品质！面对诱惑和困难时，你能够保持强大的自控力，坚定地朝着目标前进。你善于延迟满足，做事有始有终，是周围人的榜样。',
                    tips: '你的意志力已经很出色了。建议继续保持，同时注意劳逸结合，避免过度苛求自己。适当的放松和弹性也有助于长期保持良好的状态。',
                };
                if (pct >= 70) return {
                    class: 'good',
                    text: '意志力比较坚强',
                    desc: '你的意志力水平良好。大多数时候你能够控制自己，克服困难，完成任务。虽然偶尔会有松懈，但整体上你是一个有执行力的人。',
                    tips: '你已经有不错的意志力基础。可以尝试设定更具挑战性的目标，逐步培养更强的自控力。同时注意识别容易让你松懈的情境，提前做好应对策略。',
                };
                if (pct >= 50) return {
                    class: 'moderate',
                    text: '意志力一般',
                    desc: '你的意志力处于中等水平。有时你能很好地控制自己，有时又容易被诱惑或困难打败。你的表现可能因情境而异，还需进一步培养自控能力。',
                    tips: '建议从小目标开始练习，逐步增强自控力。可以尝试使用"番茄工作法"等时间管理工具，将大任务分解为小块。每天坚持一个小习惯，慢慢积累信心和能力。',
                };
                if (pct >= 30) return {
                    class: 'weak',
                    text: '意志力偏弱',
                    desc: '你的意志力有较大的提升空间。你经常在诱惑面前屈服，或者在困难面前退缩。这可能会影响你在学习、工作或生活中的表现和成就感。',
                    tips: '不要气馁，意志力是可以通过训练增强的。建议：① 从最简单的小事开始坚持（如每天早起5分钟）；② 减少环境中的诱惑（如手机放远些）；③ 找一个意志力强的伙伴互相监督；④ 完成目标后给自己正向奖励。',
                };
                return {
                    class: 'very-weak',
                    text: '意志力需要特别关注',
                    desc: '你的意志力水平较低，自控能力比较薄弱。你可能会频繁地体验到计划被打乱、目标难以实现的挫败感。这并不意味着你缺乏能力，而是可能需要更系统的训练和支持。',
                    tips: '请记住，意志力不足不是道德缺陷，而是可以通过科学方法改善的。建议：① 从极小的目标开始，确保成功体验；② 寻求外部支持和监督；③ 关注自己的情绪状态，有时意志力薄弱是情绪问题的信号；④ 如果长期感到无力改变，建议咨询心理专业人士。',
                };
            }

            function submitAndShow() {
                const total = questions.length;
                const answered = Object.keys(answers).length;
                if (answered < total) {
                    showToast(`还有 ${total - answered} 题未回答，请完成全部题目`);
                    return;
                }

                // 计算实际总分
                let totalRealScore = 0;
                questions.forEach(q => {
                    totalRealScore += getRealScore(q, answers[q.id]);
                });

                const level = calcLevel(totalRealScore);
                const maxScore = questions.length * 5;
                const percentage = Math.round(totalRealScore / maxScore * 100);

                resultsSection.classList.add('visible');
                resultDate.textContent = `测评时间：${new Date().toLocaleString('zh-CN')}`;

                // 统计卡片
                let statClass = '';
                if (percentage < 50) statClass = ' warning';
                if (percentage < 30) statClass = ' danger-stat';

                resultSummary.innerHTML = `
                    <div class="result-stat${statClass}">
                        <div class="stat-val">${totalRealScore}</div>
                        <div class="stat-lbl">实际总分 (20-100)</div>
                    </div>
                    <div class="result-stat">
                        <div class="stat-val">${percentage}%</div>
                        <div class="stat-lbl">意志力指数</div>
                    </div>
                `;

                resultLevelContainer.innerHTML =
                    `<div class="result-level ${level.class}">${level.text}</div>`;
                resultDesc.innerHTML = level.desc;
                resultTips.innerHTML = `<strong>💡 提升建议：</strong>${level.tips}`;

                // 锁定作答区域
                progressSection.style.opacity = '0.5';
                questionsCard.style.opacity = '0.5';
                navButtons.style.opacity = '0.5';
                questionsCard.style.pointerEvents = 'none';
                navButtons.style.pointerEvents = 'none';

                saveAnswers();
                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                window.scrollBy(0, -60);
            }

            function retakeTest() {
                if (confirm('确定要清除所有答案并重新测评吗？')) {
                    answers = {};
                    localStorage.removeItem('willpower_answers');
                    resultsSection.classList.remove('visible');
                    progressSection.style.opacity = '1';
                    questionsCard.style.opacity = '1';
                    navButtons.style.opacity = '1';
                    questionsCard.style.pointerEvents = 'auto';
                    navButtons.style.pointerEvents = 'auto';
                    resultLevelContainer.innerHTML = '';
                    resultDesc.innerHTML = '';
                    resultTips.innerHTML = '';
                    renderQuestions();
                    updateProgress();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }

            btnClear.addEventListener('click', clearAll);
            btnSubmit.addEventListener('click', submitAndShow);
            btnRetake.addEventListener('click', retakeTest);

            renderQuestions();
            updateProgress();

            console.log('💪 意志力测试已就绪 · 20题 · 1-5级评分 · 反向计分题已标注');
        })();
    </script>
</body>
</html>
