<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>意志力测试 - 心灵驿站</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* 意志力测试 特有样式 */
        .container { max-width: 850px; }
        .option-score { display:block; font-size:0.58rem; font-weight:400; opacity:0.7; letter-spacing:0.03em; }
        .option-btn.selected .option-score { opacity:1; }
        .result-stat.danger-stat .stat-val { color: var(--danger); }
        .result-level.strong { background: #e6f4ea; color: #3d6a4f; }
        .result-level.good { background: #eaf5ef; color: #2d5a40; }
        .result-level.moderate { background: #fef6e6; color: #8b6919; }
        .result-level.weak { background: #fef0ea; color: #8b3d1f; }
        .result-level.very-weak { background: #fdecea; color: #8b1a1a; }
        .result-desc {
            background: #faf8fc; border-radius: var(--radius); padding: 18px;
            font-size: 0.9rem; line-height: 1.7; color: var(--text);
            margin: 16px 0; border: 1px solid #eeeaf2;
        }
        .result-tips {
            background: #fef9f0; border-radius: var(--radius); padding: 16px;
            font-size: 0.85rem; line-height: 1.7; color: #6b4f20;
            margin: 12px 0; border: 1px solid #f0d89c;
        }
        .result-tips strong { color: #4a3510; }
        .disclaimer { background: #fef9f0; border: 1px solid #f0d89c; border-radius: var(--radius); padding: 14px 18px; font-size: 0.82rem; color: #8b6d3b; line-height: 1.6; margin-top: 16px; display: flex; gap: 10px; align-items: flex-start; }
        @media (max-width:600px) {
            .option-btn { padding:7px 3px; font-size:0.68rem; min-width:48px; border-radius:16px; }
            .option-score { font-size:0.55rem; }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="back-link" aria-label="返回量表目录">← 目录</a>
            <div class="scale-label">
                意志力测试
                <small>Willpower Assessment</small>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>💪 意志力测试</h1>
            <p class="subtitle">评估你的自控力与坚持能力 · 共20题 · 约3-5分钟</p>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-info">
                <span>请根据你的实际情况，选择最符合的一项</span>
                <span id="answeredCount">已答 0 题</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%;"></div>
            </div>
            <div style="font-size:0.68rem;color:var(--text-muted);margin-top:6px;">
                ⚡ 标注 <span class="reverse-badge">反向</span> 的题目计分方式与其他题目相反
            </div>
        </div>

        <div class="questions-card" id="questionsCard"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="nav-btn clear-btn" id="btnClear">🔄 清空全部答案</button>
            <button class="nav-btn submit-btn" id="btnSubmit" disabled>✅ 提交答卷 · 查看结果</button>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>💎 意志力测评结果</h2>
                <span class="result-date" id="resultDate"></span>
            </div>
            <div class="result-summary" id="resultSummary"></div>
            <div id="resultLevelContainer"></div>
            <div class="result-desc" id="resultDesc"></div>
            <div class="result-tips" id="resultTips"></div>
            <div class="disclaimer">
                <span class="disclaimer-icon">⚠️</span>
                <span><strong>重要提醒：</strong>本测试为意志力自评工具，结果仅供自我了解和参考。意志力是可以通过训练提升的，<strong>分数不理想不代表无法改变</strong>。如果你在自控方面持续感到困难并影响生活，建议寻求专业心理帮助。</span>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <button class="nav-btn" id="btnRetake">🔄 重新测评</button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <a href="index.html">← 返回量表目录</a> · 心灵驿站 - 心理测评中心
    </footer>

    <script src="common.js"></script>
    <script>
        (function() {
            // 意志力测试题目 (20题)
            const questions = [
                { id: 1, text: '我能抗拒诱惑，坚持完成该做的事情', reverse: false },
                { id: 2, text: '做事情时，我常常半途而废', reverse: true },
                { id: 3, text: '一旦设定了目标，我就会努力去实现它', reverse: false },
                { id: 4, text: '我常常把今天该做的事情推到明天', reverse: true },
                { id: 5, text: '即使面对枯燥的任务，我也能坚持完成', reverse: false },
                { id: 6, text: '心情不好时，我就会放弃手头的事情', reverse: true },
                { id: 7, text: '在嘈杂的环境中我也能专心做事', reverse: false },
                { id: 8, text: '我的计划常常被一时的冲动打乱', reverse: true },
                { id: 9, text: '为了长远的目标，我可以忍受短期的辛苦', reverse: false },
                { id: 10, text: '碰到困难时，我很容易选择放弃', reverse: true },
                { id: 11, text: '我能够严格遵守自己制定的规则', reverse: false },
                { id: 12, text: '看到美食时我很难控制自己的食欲', reverse: true },
                { id: 13, text: '即使没有人监督，我也能自觉完成任务', reverse: false },
                { id: 14, text: '我经常因为刷手机或娱乐而耽误正事', reverse: true },
                { id: 15, text: '失败后我能很快振作起来继续努力', reverse: false },
                { id: 16, text: '我在做决定后常常会后悔和动摇', reverse: true },
                { id: 17, text: '我能够长时间专注于一件事情', reverse: false },
                { id: 18, text: '遇到反对意见时，我很容易改变自己的立场', reverse: true },
                { id: 19, text: '我相信通过坚持可以实现自己设定的目标', reverse: false },
                { id: 20, text: '我的生活缺乏规律，经常随心所欲', reverse: true },
            ];

            // 选项：1-完全不符合 到 5-完全符合
            const options = [
                { value: 1, label: '完全不符合', short: '完全不符' },
                { value: 2, label: '比较不符合', short: '不太符合' },
                { value: 3, label: '一般', short: '一般' },
                { value: 4, label: '比较符合', short: '比较符合' },
                { value: 5, label: '完全符合', short: '完全符合' },
            ];

            function calcLevel(totalRealScore) {
                var maxScore = questions.length * 5;
                var pct = totalRealScore / maxScore * 100;
                if (pct >= 85) return {
                    class: 'strong', text: '意志力非常坚强',
                    desc: '你拥有出色的意志品质！面对诱惑和困难时，你能够保持强大的自控力，坚定地朝着目标前进。你善于延迟满足，做事有始有终，是周围人的榜样。',
                    tips: '你的意志力已经很出色了。建议继续保持，同时注意劳逸结合，避免过度苛求自己。适当的放松和弹性也有助于长期保持良好的状态。'
                };
                if (pct >= 70) return {
                    class: 'good', text: '意志力比较坚强',
                    desc: '你的意志力水平良好。大多数时候你能够控制自己，克服困难，完成任务。虽然偶尔会有松懈，但整体上你是一个有执行力的人。',
                    tips: '你已经有不错的意志力基础。可以尝试设定更具挑战性的目标，逐步培养更强的自控力。同时注意识别容易让你松懈的情境，提前做好应对策略。'
                };
                if (pct >= 50) return {
                    class: 'moderate', text: '意志力一般',
                    desc: '你的意志力处于中等水平。有时你能很好地控制自己，有时又容易被诱惑或困难打败。你的表现可能因情境而异，还需进一步培养自控能力。',
                    tips: '建议从小目标开始练习，逐步增强自控力。可以尝试使用"番茄工作法"等时间管理工具，将大任务分解为小块。每天坚持一个小习惯，慢慢积累信心和能力。'
                };
                if (pct >= 30) return {
                    class: 'weak', text: '意志力偏弱',
                    desc: '你的意志力有较大的提升空间。你经常在诱惑面前屈服，或者在困难面前退缩。这可能会影响你在学习、工作或生活中的表现和成就感。',
                    tips: '不要气馁，意志力是可以通过训练增强的。建议：① 从最简单的小事开始坚持（如每天早起5分钟）；② 减少环境中的诱惑（如手机放远些）；③ 找一个意志力强的伙伴互相监督；④ 完成目标后给自己正向奖励。'
                };
                return {
                    class: 'very-weak', text: '意志力需要特别关注',
                    desc: '你的意志力水平较低，自控能力比较薄弱。你可能会频繁地体验到计划被打乱、目标难以实现的挫败感。这并不意味着你缺乏能力，而是可能需要更系统的训练和支持。',
                    tips: '请记住，意志力不足不是道德缺陷，而是可以通过科学方法改善的。建议：① 从极小的目标开始，确保成功体验；② 寻求外部支持和监督；③ 关注自己的情绪状态，有时意志力薄弱是情绪问题的信号；④ 如果长期感到无力改变，建议咨询心理专业人士。'
                };
            }

            const engine = new ScaleEngine({
                questions: questions,
                options: options,
                storageKey: 'willpower_answers',
                scaleName: '意志力测试',
                getRealScore: function(q, selectedValue) {
                    if (q.reverse) { return 6 - selectedValue; }
                    return selectedValue;
                },
                onSubmit: function(self) {
                    var totalRealScore = 0;
                    questions.forEach(function(q) {
                        totalRealScore += self.getScore(q, self.answers[q.id]);
                    });

                    var level = calcLevel(totalRealScore);
                    var maxScore = questions.length * 5;
                    var percentage = Math.round(totalRealScore / maxScore * 100);

                    var statClass = '';
                    if (percentage < 50) statClass = ' warning';
                    if (percentage < 30) statClass = ' danger-stat';

                    self.resultSummary.innerHTML = [
                        '<div class="result-stat' + statClass + '">',
                            '<div class="stat-val">' + totalRealScore + '</div>',
                            '<div class="stat-lbl">实际总分 (20-100)</div>',
                        '</div>',
                        '<div class="result-stat">',
                            '<div class="stat-val">' + percentage + '%</div>',
                            '<div class="stat-lbl">意志力指数</div>',
                        '</div>'
                    ].join('');
                    self.resultLevelContainer.innerHTML = '<div class="result-level ' + level.class + '">' + level.text + '</div>';
                    document.getElementById('resultDesc').innerHTML = level.desc;
                    document.getElementById('resultTips').innerHTML = '<strong>💡 提升建议：</strong>' + level.tips;

                    self.lockAnswerArea();
                    self.showResults();
                },
                onRetake: function(self) {
                    document.getElementById('resultDesc').innerHTML = '';
                    document.getElementById('resultTips').innerHTML = '';
                }
            });

            engine.init();
        })();
    </script>
</body>
</html>
