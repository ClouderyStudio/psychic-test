<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪稳定性测试 - 心灵驿站</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* 情绪稳定性测试 特有样式 */
        .container { max-width: 850px; }
        .result-level.very-stable { background: #e6f4ea; color: #3d6a4f; }
        .result-level.stable { background: #eaf5ef; color: #2d5a40; }
        .result-level.moderate { background: #fef6e6; color: #8b6919; }
        .result-level.unstable { background: #fef0ea; color: #8b3d1f; }
        .result-level.very-unstable { background: #fdecea; color: #8b1a1a; }
        .result-desc {
            background: #faf8fc; border-radius: var(--radius); padding: 16px;
            font-size: 0.9rem; line-height: 1.7; color: var(--text);
            margin: 16px 0; border: 1px solid #eeeaf2;
        }
        @media (max-width:600px) {
            .option-btn { padding:8px 4px; font-size:0.72rem; min-width:55px; border-radius:18px; }
            .option-desc { font-size:0.55rem; }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="back-link" aria-label="返回量表目录">← 目录</a>
            <div class="scale-label">
                情绪稳定性测试
                <small>Emotional Stability Test</small>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>⚖️ 情绪稳定性测试</h1>
            <p class="subtitle">评估你情绪的稳定程度与自我调节能力 · 共25题 · 约5-8分钟</p>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-info">
                <span>请根据你的实际情况，选择最符合的一项</span>
                <span id="answeredCount">已答 0 题</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%;"></div>
            </div>
            <div style="font-size:0.7rem;color:var(--text-muted);margin-top:6px;">
                ⚡ 标注 <span class="reverse-badge">反向</span> 的题目计分方式与其他题目相反
            </div>
        </div>

        <div class="questions-card" id="questionsCard"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="nav-btn clear-btn" id="btnClear">🔄 清空全部答案</button>
            <button class="nav-btn submit-btn" id="btnSubmit" disabled>✅ 提交答卷 · 查看结果</button>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>📊 测评结果报告</h2>
                <span class="result-date" id="resultDate"></span>
            </div>
            <div class="result-summary" id="resultSummary"></div>
            <div id="resultLevelContainer"></div>
            <div id="resultDescContainer"></div>
            <div class="disclaimer">
                <span class="disclaimer-icon">⚠️</span>
                <span><strong>重要提醒：</strong>本测试为情绪稳定性自评工具，结果仅供自我参考，<strong>不能替代专业心理评估</strong>。情绪的波动是人之常情，如果你持续感到困扰，请寻求专业帮助。</span>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <button class="nav-btn" id="btnRetake">🔄 重新测评</button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <a href="index.html">← 返回量表目录</a> · 心灵驿站 - 心理测评中心
    </footer>

    <script src="common.js"></script>
    <script>
        (function() {
            // 情绪稳定性测试题目 (25题)
            const questions = [
                { id: 1, text: '我的情绪经常起伏不定', reverse: false },
                { id: 2, text: '面对突发状况，我能保持冷静', reverse: true },
                { id: 3, text: '一点小事也会让我心烦意乱', reverse: false },
                { id: 4, text: '我很少为未来而担忧', reverse: true },
                { id: 5, text: '我容易感到紧张和焦虑', reverse: false },
                { id: 6, text: '即使遇到挫折，我也能很快恢复平静', reverse: true },
                { id: 7, text: '我经常感到不开心或沮丧', reverse: false },
                { id: 8, text: '我的情绪反应通常比较温和', reverse: true },
                { id: 9, text: '我常常无缘无故地感到疲倦', reverse: false },
                { id: 10, text: '我能够很好地控制自己的脾气', reverse: true },
                { id: 11, text: '别人的一句话就能让我想很久', reverse: false },
                { id: 12, text: '我很少感到孤独', reverse: true },
                { id: 13, text: '我容易因为小事而发脾气', reverse: false },
                { id: 14, text: '我对自己的情绪变化有清晰的觉察', reverse: true },
                { id: 15, text: '遇到压力时，我常常不知道如何是好', reverse: false },
                { id: 16, text: '我觉得自己是个乐观的人', reverse: true },
                { id: 17, text: '我经常感到内心不安', reverse: false },
                { id: 18, text: '适应新环境对我来说并不困难', reverse: true },
                { id: 19, text: '我有时会突然感到悲伤，却说不出原因', reverse: false },
                { id: 20, text: '我能够在情绪低落时主动调整自己', reverse: true },
                { id: 21, text: '我常常反复思考不愉快的事情', reverse: false },
                { id: 22, text: '多数时候，我的心情是平静而稳定的', reverse: true },
                { id: 23, text: '我会因为别人的批评而感到非常难过', reverse: false },
                { id: 24, text: '我相信自己有能力处理情绪问题', reverse: true },
                { id: 25, text: '我的情绪容易被外界环境所影响', reverse: false },
            ];

            // 选项：1-完全不符合，2-比较不符合，3-一般，4-比较符合，5-完全符合
            const options = [
                { value: 1, label: '完全不符合', short: '完全不符' },
                { value: 2, label: '比较不符合', short: '不太符合' },
                { value: 3, label: '一般', short: '一般' },
                { value: 4, label: '比较符合', short: '比较符合' },
                { value: 5, label: '完全符合', short: '完全符合' },
            ];

            function calcLevel(totalRealScore) {
                if (totalRealScore <= 50) return { class: 'very-stable', text: '情绪非常稳定', desc: '你的情绪波动很小，能够从容应对生活中的压力与挑战。你善于管理自己的情绪，心态平和，内心强大。' };
                if (totalRealScore <= 70) return { class: 'stable', text: '情绪比较稳定', desc: '大多数时候你的情绪是平稳的，偶尔会有波动但能较快恢复。你具备一定的情绪调节能力，生活整体上处于比较舒适的状态。' };
                if (totalRealScore <= 90) return { class: 'moderate', text: '情绪稳定性一般', desc: '你的情绪时好时坏，有时能控制得很好，有时又容易受到影响。建议你多关注自己的情绪变化，学习一些放松技巧，提升情绪管理能力。' };
                if (totalRealScore <= 110) return { class: 'unstable', text: '情绪不太稳定', desc: '你经常被负面情绪困扰，容易紧张、焦虑或低落。外界的风吹草动都可能引起内心的波澜。建议你有意识地练习正念、深呼吸等方法，或与朋友倾诉，必要时寻求专业心理帮助。' };
                return { class: 'very-unstable', text: '情绪非常不稳定', desc: '你的情绪起伏很大，时常感到失控，这可能会对你的生活、工作和人际关系造成显著影响。我们强烈建议你考虑寻求专业心理咨询师的帮助，学习系统性的情绪调节策略。请记住，求助是勇敢的表现。' };
            }

            const engine = new ScaleEngine({
                questions: questions,
                options: options,
                storageKey: 'emotion_stability_answers',
                scaleName: '情绪稳定性测试',
                getRealScore: function(q, selectedValue) {
                    if (q.reverse) { return 6 - selectedValue; }
                    return selectedValue;
                },
                onSubmit: function(self) {
                    var totalRealScore = 0;
                    questions.forEach(function(q) {
                        totalRealScore += self.getScore(q, self.answers[q.id]);
                    });

                    var level = calcLevel(totalRealScore);
                    var maxScore = questions.length * 5;
                    var minScore = questions.length * 1;
                    var percentage = Math.round((totalRealScore - minScore) / (maxScore - minScore) * 100);

                    var statClass = '';
                    if (totalRealScore > 90) statClass = ' warning';
                    if (totalRealScore > 110) statClass = ' severe';

                    self.resultSummary.innerHTML = [
                        '<div class="result-stat' + statClass + '">',
                            '<div class="stat-val">' + totalRealScore + '</div>',
                            '<div class="stat-lbl">实际总分 (' + minScore + '-' + maxScore + ')</div>',
                        '</div>',
                        '<div class="result-stat">',
                            '<div class="stat-val">' + percentage + '%</div>',
                            '<div class="stat-lbl">情绪不稳定指数</div>',
                        '</div>'
                    ].join('');
                    self.resultLevelContainer.innerHTML = '<div class="result-level ' + level.class + '">' + level.text + '</div>';
                    document.getElementById('resultDescContainer').innerHTML = '<div class="result-desc">' + level.desc + '</div>';

                    self.lockAnswerArea();
                    self.showResults();
                },
                onRetake: function(self) {
                    document.getElementById('resultDescContainer').innerHTML = '';
                }
            });

            engine.init();
        })();
    </script>
</body>
</html>
