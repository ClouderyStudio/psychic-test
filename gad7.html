<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAD-7 广泛性焦虑障碍量表 - 心灵驿站</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="back-link" aria-label="返回量表目录">← 目录</a>
            <div class="scale-label">
                GAD-7 广泛性焦虑障碍量表
                <small>Generalized Anxiety Disorder-7</small>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>😟 GAD-7 广泛性焦虑障碍量表</h1>
            <p class="subtitle">评估过去两周的焦虑状况 · 共7题 · 约2-3分钟</p>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-info">
                <span>请回想过去两周里，以下情况困扰你的程度</span>
                <span id="answeredCount">已答 0 题</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%;"></div>
            </div>
        </div>

        <div class="questions-card" id="questionsCard"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="nav-btn clear-btn" id="btnClear">🔄 清空全部答案</button>
            <button class="nav-btn submit-btn" id="btnSubmit" disabled>✅ 提交答卷 · 查看结果</button>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>📊 测评结果报告</h2>
                <span class="result-date" id="resultDate"></span>
            </div>
            <div class="result-summary" id="resultSummary"></div>
            <div id="resultLevelContainer"></div>
            <div id="crisisAlertContainer"></div>
            <div class="disclaimer">
                <span class="disclaimer-icon">⚠️</span>
                <span><strong>重要提醒：</strong>本量表为自我筛查工具，结果仅供自我参考，<strong>不能替代专业心理医生的诊断</strong>。如果你对结果感到担忧，请咨询专业医生或拨打心理援助热线 <strong>12320-5</strong>。</span>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <button class="nav-btn" id="btnRetake">🔄 重新测评</button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <a href="index.html">← 返回量表目录</a> · 心灵驿站 - 心理测评中心
    </footer>

    <script src="common.js"></script>
    <script>
        (function() {
            var questions = [
                { id: 1, text: '感觉紧张、焦虑或急切' },
                { id: 2, text: '不能停止或无法控制担心' },
                { id: 3, text: '对各种各样的事情担忧过多' },
                { id: 4, text: '很难放松下来' },
                { id: 5, text: '由于不安而无法静坐' },
                { id: 6, text: '变得容易烦恼或急躁' },
                { id: 7, text: '感到害怕，似乎将有可怕的事情发生' }
            ];

            var options = [
                { value: 0, label: '从没有', short: '从没有', desc: '完全没有' },
                { value: 1, label: '有几天', short: '有几天', desc: '偶尔出现' },
                { value: 2, label: '一半以上天数', short: '一半以上', desc: '超过一周' },
                { value: 3, label: '几乎每天', short: '几乎每天', desc: '天天如此' }
            ];

            function calcLevel(score) {
                if (score >= 0 && score <= 4) return { text: '几乎没有焦虑', cls: 'none' };
                if (score >= 5 && score <= 9) return { text: '轻微焦虑', cls: 'mild' };
                if (score >= 10 && score <= 14) return { text: '中度焦虑', cls: 'moderate' };
                return { text: '重度焦虑', cls: 'severe' };
            }

            var engine = new ScaleEngine({
                questions: questions,
                options: options,
                storageKey: 'gad7_answers',
                scaleName: 'GAD-7 广泛性焦虑障碍量表',
                useValueAsScore: true,
                showReverseBadge: false,
                onSubmit: function(eng) {
                    var totalScore = 0;
                    eng.questions.forEach(function(q) {
                        totalScore += eng.answers[q.id];
                    });

                    var level = calcLevel(totalScore);
                    var warning = totalScore >= 5;

                    eng.resultSummary.innerHTML =
                        '<div class="result-stat ' + (warning ? 'warning' : '') + '">' +
                            '<div class="stat-val">' + totalScore + '</div>' +
                            '<div class="stat-lbl">总分 (0-21)</div>' +
                        '</div>';

                    eng.resultLevelContainer.innerHTML =
                        '<div class="result-level ' + level.cls + '">' + level.text + '</div>';

                    // 危机预警：总分≥15 或第7题得分≥2
                    var q7 = eng.answers[7] || 0;
                    var crisisHTML = '';
                    if (totalScore >= 15 || q7 >= 2) {
                        crisisHTML =
                            '<div class="crisis-alert">' +
                                '<span class="crisis-icon">⚠️</span>' +
                                '<div>' +
                                    '<strong>提醒：</strong>你的焦虑程度较高。如果这种状态已经显著影响日常生活，建议你寻求专业心理支持。<br>' +
                                    '📞 <strong>全国心理援助热线：12320-5</strong>　|　📞 <strong>北京心理危机干预中心：010-82951332</strong>' +
                                '</div>' +
                            '</div>';
                    }
                    eng.crisisAlertContainer.innerHTML = crisisHTML;

                    eng.lockAnswerArea();
                    eng.showResults();
                }
            });

            engine.init();
        })();
    </script>
</body>
</html>
