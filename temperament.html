<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气质类型量表 - 心灵驿站</title>
    <link rel="stylesheet" href="common.css">
    <style>
        :root {
            --choleric: #c0392b;
            --choleric-light: #fdecea;
            --choleric-tag: #f5c6c0;
            --sanguine: #d4a843;
            --sanguine-light: #fef9f0;
            --sanguine-tag: #f0e0b8;
            --phlegmatic: #4a8c6f;
            --phlegmatic-light: #eaf5ef;
            --phlegmatic-tag: #c5e0d2;
            --melancholic: #5b6d9e;
            --melancholic-light: #eef1f8;
            --melancholic-tag: #d0d6ec;
        }
        .page-dots {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
            justify-content: center;
        }
        .page-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d8d2de;
            cursor: pointer;
            border: none;
            padding: 0;
            transition: var(--transition);
        }
        .page-dot.completed {
            background: #a0c4d1;
        }
        .page-dot.active {
            background: var(--primary);
            width: 22px;
            border-radius: 10px;
        }
        .options-mini {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }
        .option-pill {
            padding: 6px 16px;
            border-radius: 15px;
            border: 1.5px solid #e0dbe4;
            background: #fff;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .option-pill:hover {
            border-color: #c5bdd0;
            background: #faf9fb;
        }
        .option-pill.selected-yes {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            font-weight: 600;
        }
        .option-pill.selected-no {
            background: #e8e3ec;
            color: #5a4e66;
            border-color: #c5bdd0;
            font-weight: 600;
        }
        .nav-btn.submit-btn {
            background: #3d5a4f;
            color: #fff;
            border-color: #3d5a4f;
        }
        .nav-btn.submit-btn:hover:not(:disabled) {
            background: #2f4840;
        }
        .type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .type-card {
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(58, 53, 64, 0.08);
        }
        .type-card.choleric {
            background: var(--choleric-light);
            border-color: var(--choleric-tag);
        }
        .type-card.sanguine {
            background: var(--sanguine-light);
            border-color: var(--sanguine-tag);
        }
        .type-card.phlegmatic {
            background: var(--phlegmatic-light);
            border-color: var(--phlegmatic-tag);
        }
        .type-card.melancholic {
            background: var(--melancholic-light);
            border-color: var(--melancholic-tag);
        }
        .type-card .type-icon {
            font-size: 1.8rem;
            margin-bottom: 2px;
        }
        .type-card .type-name {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }
        .type-card .type-eng {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.03em;
        }
        .type-card .type-score {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .type-card .type-max {
            font-size: 0.65rem;
            color: var(--text-muted);
        }
        .type-card .type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            margin-top: 4px;
        }
        .badge-typical {
            background: #d4e6ef;
            color: #2c5668;
        }
        .badge-tendency {
            background: #fef9f0;
            color: #8b6919;
        }
        .badge-none {
            background: #f0edf3;
            color: #6b6372;
        }
        .result-conclusion {
            background: #faf8fc;
            border-radius: var(--radius);
            padding: 18px;
            text-align: center;
            border: 1px solid #eeeaf2;
            margin: 16px 0;
        }
        .result-conclusion .conclusion-title {
            font-weight: 700;
            font-size: 1rem;
            color: #2c2633;
        }
        .result-conclusion .conclusion-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 6px;
        }
        @media (max-width: 600px) {
            .option-pill {
                padding: 5px 12px;
                font-size: 0.7rem;
            }
            .type-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="back-link" aria-label="返回量表目录">← 目录</a>
            <div class="scale-label">
                气质类型量表
                <small>Temperament Type Scale</small>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>🌈 气质类型量表</h1>
            <p class="subtitle">了解你的气质倾向 · 共60题 · 约8-12分钟</p>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-info">
                <span id="progressLabel">第 1 页 / 共 4 页（每页15题）</span>
                <span id="answeredCount">已答 0 题</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%;"></div>
            </div>
            <div class="page-dots" id="pageDots"></div>
        </div>

        <div class="questions-card" id="questionsCard"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="nav-btn" id="btnPrev" disabled>← 上一页</button>
            <button class="nav-btn clear-btn" id="btnClearPage">🔄 清空本页</button>
            <button class="nav-btn" id="btnNext">下一页 →</button>
        </div>
        <div class="nav-buttons" id="submitRow" style="display:none;justify-content:center;">
            <button class="nav-btn submit-btn" id="btnSubmit" disabled>✅ 提交答卷 · 查看结果</button>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>🧬 气质类型测评结果</h2>
                <span class="result-date" id="resultDate"></span>
            </div>
            <div class="type-grid" id="typeGrid"></div>
            <div class="result-conclusion" id="resultConclusion"></div>
            <div class="disclaimer">
                <span class="disclaimer-icon">⚠️</span>
                <span><strong>重要提醒：</strong>气质类型理论源自古代医学，本测试为趣味性自评工具，结果仅供自我了解和参考。气质没有好坏之分，每种类型都有其独特的优势和特点。<strong>本测试不能替代专业心理评估</strong>。</span>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <button class="nav-btn" id="btnRetake">🔄 重新测评</button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <a href="index.html">← 返回量表目录</a> · 心灵驿站 - 心理测评中心
    </footer>

    <script>
        (function() {
            // 气质类型量表 - 60题（混合排列）
            const questions = [
                // 第1页 (1-15)
                { id: 1, text: '遇到可气的事就怒不可遏，想把心里话全说出来才痛快', type: 'choleric' },
                { id: 2, text: '到一个新环境很快就能适应', type: 'sanguine' },
                { id: 3, text: '做事力求稳妥，不做无把握的事', type: 'phlegmatic' },
                { id: 4, text: '宁肯一个人干事，不愿很多人在一起', type: 'melancholic' },
                { id: 5, text: '和人争吵时，总是先发制人，喜欢挑衅', type: 'choleric' },
                { id: 6, text: '善于和人交往', type: 'sanguine' },
                { id: 7, text: '喜欢安静的环境', type: 'phlegmatic' },
                { id: 8, text: '厌恶那些强烈的刺激，如尖叫、噪音、危险镜头等', type: 'melancholic' },
                { id: 9, text: '做事总是有旺盛的精力', type: 'choleric' },
                { id: 10, text: '在多数情况下情绪是乐观的', type: 'sanguine' },
                { id: 11, text: '生活有规律，很少违反作息制度', type: 'phlegmatic' },
                { id: 12, text: '碰到陌生人觉得很拘束', type: 'melancholic' },
                { id: 13, text: '情绪高昂时觉得干什么都有趣，低落时又觉得什么都没意思', type: 'choleric' },
                { id: 14, text: '在人群中从不觉得过分拘束', type: 'sanguine' },
                { id: 15, text: '遇到令人气愤的事，能很好地自我克制', type: 'phlegmatic' },
                // 第2页 (16-30)
                { id: 16, text: '遇到问题常常举棋不定，优柔寡断', type: 'melancholic' },
                { id: 17, text: '对学习、工作、事业怀有很高的热情', type: 'choleric' },
                { id: 18, text: '理解问题总是比别人快', type: 'sanguine' },
                { id: 19, text: '当注意力集中于一事物时，别的事很难使我分心', type: 'phlegmatic' },
                { id: 20, text: '碰到危险情景，常有一种极度恐怖感', type: 'melancholic' },
                { id: 21, text: '喜欢参加热烈的活动', type: 'choleric' },
                { id: 22, text: '符合兴趣的事干起来劲头十足，否则就不想干', type: 'sanguine' },
                { id: 23, text: '能够长时间做枯燥、单调的工作', type: 'phlegmatic' },
                { id: 24, text: '一点小事就能引起情绪波动', type: 'melancholic' },
                { id: 25, text: '宁愿侃侃而谈，不愿窃窃私语', type: 'choleric' },
                { id: 26, text: '讨厌那种需要耐心和细致的工作', type: 'sanguine' },
                { id: 27, text: '与人交往不卑不亢', type: 'phlegmatic' },
                { id: 28, text: '爱看感情细腻、描写人物内心活动的文学作品', type: 'melancholic' },
                { id: 29, text: '认准一个目标就希望尽快实现，不达目的誓不罢休', type: 'choleric' },
                { id: 30, text: '工作学习时间长了，常感到厌倦', type: 'sanguine' },
                // 第3页 (31-45)
                { id: 31, text: '理解问题常比别人慢些', type: 'phlegmatic' },
                { id: 32, text: '别人说我总是闷闷不乐', type: 'melancholic' },
                { id: 33, text: '做事有些莽撞，常常不考虑后果', type: 'choleric' },
                { id: 34, text: '疲倦时只要短暂休息就能精神抖擞', type: 'sanguine' },
                { id: 35, text: '不喜欢长时间谈论一个问题，愿意实际动手干', type: 'phlegmatic' },
                { id: 36, text: '心里有话宁愿自己想，不愿说出来', type: 'melancholic' },
                { id: 37, text: '喜欢运动量大的剧烈体育活动', type: 'choleric' },
                { id: 38, text: '能够很快地忘记那些不愉快的事情', type: 'sanguine' },
                { id: 39, text: '老师讲新知识时，总希望讲慢些，多重复几遍', type: 'phlegmatic' },
                { id: 40, text: '学习同样一段时间后，常比别人更疲倦', type: 'melancholic' },
                { id: 41, text: '爱看情节起伏跌宕、激动人心的小说', type: 'choleric' },
                { id: 42, text: '接受一个任务后，就希望把它迅速完成', type: 'sanguine' },
                { id: 43, text: '不能很快地把注意力从一件事转移到另一件事上', type: 'phlegmatic' },
                { id: 44, text: '做作业或完成一件工作总比别人花的时间多', type: 'melancholic' },
                { id: 45, text: '和周围人们的关系总是相处不好', type: 'choleric' },
                // 第4页 (46-60)
                { id: 46, text: '能够同时注意几件事情', type: 'sanguine' },
                { id: 47, text: '认为墨守成规比冒风险强些', type: 'phlegmatic' },
                { id: 48, text: '烦闷时别人很难使我高兴起来', type: 'melancholic' },
                { id: 49, text: '别人说我"出语伤人"，可我并不觉得这样', type: 'choleric' },
                { id: 50, text: '希望做变化大、花样多的工作', type: 'sanguine' },
                { id: 51, text: '对工作抱认真严谨、始终一贯的态度', type: 'phlegmatic' },
                { id: 52, text: '喜欢复习学过的知识，重复做已经掌握的工作', type: 'melancholic' },
                { id: 53, text: '兴奋的事常使我失眠', type: 'choleric' },
                { id: 54, text: '反应敏捷，头脑机智', type: 'sanguine' },
                { id: 55, text: '在体育活动中，常因反应慢而落后', type: 'phlegmatic' },
                { id: 56, text: '小时候会背的诗歌，似乎比别人记得更清楚', type: 'melancholic' },
                { id: 57, text: '羡慕那种善于克制自己感情的人', type: 'choleric' },
                { id: 58, text: '假如工作枯燥无味，马上就会情绪低落', type: 'sanguine' },
                { id: 59, text: '喜欢有条理而不甚麻烦的工作', type: 'phlegmatic' },
                { id: 60, text: '老师讲新概念常常听不懂，但弄懂后很难忘记', type: 'melancholic' },
            ];

            const QUESTIONS_PER_PAGE = 15;
            const TOTAL_PAGES = Math.ceil(questions.length / QUESTIONS_PER_PAGE); // 4

            // 气质类型信息
            const typeInfo = {
                choleric: {
                    name: '胆汁质',
                    eng: 'Choleric',
                    icon: '🔥',
                    cssClass: 'choleric',
                    desc: '精力旺盛，热情直率，做事果断，但容易冲动，脾气急躁，情绪变化剧烈。优点包括积极主动、勇敢果断；不足是可能缺乏耐心、容易发怒。',
                },
                sanguine: {
                    name: '多血质',
                    eng: 'Sanguine',
                    icon: '🌻',
                    cssClass: 'sanguine',
                    desc: '活泼好动，反应迅速，善于交际，适应能力强，但注意力容易转移，兴趣多变。优点是乐观开朗、灵活机敏；不足是可能缺乏持久性、容易浮躁。',
                },
                phlegmatic: {
                    name: '黏液质',
                    eng: 'Phlegmatic',
                    icon: '💧',
                    cssClass: 'phlegmatic',
                    desc: '安静稳重，沉着坚定，善于克制，生活有规律，但反应较慢，不够灵活。优点是踏实可靠、有耐心；不足是可能过于保守、缺乏活力。',
                },
                melancholic: {
                    name: '抑郁质',
                    eng: 'Melancholic',
                    icon: '🌙',
                    cssClass: 'melancholic',
                    desc: '情感细腻，观察敏锐，体验深刻，但敏感多疑，容易忧虑，行动迟缓。优点是富有同理心、思考深入；不足是可能过于内向、容易陷入负面情绪。',
                },
            };

            // 状态
            let answers = {}; // { questionId: true(是) / false(否) }
            let currentPage = 1;
            const saved = localStorage.getItem('temperament_answers');
            if (saved) {
                try {
                    const p = JSON.parse(saved);
                    if (p && typeof p === 'object') answers = p;
                } catch (e) { answers = {}; }
            }

            const questionsCard = document.getElementById('questionsCard');
            const progressBar = document.getElementById('progressBar');
            const answeredCountEl = document.getElementById('answeredCount');
            const progressLabel = document.getElementById('progressLabel');
            const pageDotsEl = document.getElementById('pageDots');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnClearPage = document.getElementById('btnClearPage');
            const btnSubmit = document.getElementById('btnSubmit');
            const submitRow = document.getElementById('submitRow');
            const navButtons = document.getElementById('navButtons');
            const resultsSection = document.getElementById('resultsSection');
            const typeGrid = document.getElementById('typeGrid');
            const resultConclusion = document.getElementById('resultConclusion');
            const resultDate = document.getElementById('resultDate');
            const btnRetake = document.getElementById('btnRetake');
            const toast = document.getElementById('toast');
            const progressSection = document.getElementById('progressSection');

            let toastTimer;

            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function saveAnswers() { localStorage.setItem('temperament_answers', JSON.stringify(answers)); }

            function renderPageDots() {
                let html = '';
                for (let i = 1; i <= TOTAL_PAGES; i++) {
                    let cls = 'page-dot';
                    if (i === currentPage) cls += ' active';
                    const start = (i - 1) * QUESTIONS_PER_PAGE;
                    const end = Math.min(i * QUESTIONS_PER_PAGE, questions.length);
                    let hasAnswer = false;
                    for (let j = start; j < end; j++) {
                        if (answers[questions[j].id] !== undefined) { hasAnswer = true; break; }
                    }
                    if (hasAnswer && i !== currentPage) cls += ' completed';
                    html += `<button class="${cls}" data-page="${i}" aria-label="跳转到第${i}页" title="第${i}页"></button>`;
                }
                pageDotsEl.innerHTML = html;
                pageDotsEl.querySelectorAll('.page-dot').forEach(dot => {
                    dot.addEventListener('click', function() {
                        const p = parseInt(this.getAttribute('data-page'));
                        if (p !== currentPage) { currentPage = p;
                            renderCurrentPage(); }
                    });
                });
            }

            function renderCurrentPage() {
                const start = (currentPage - 1) * QUESTIONS_PER_PAGE;
                const end = Math.min(start + QUESTIONS_PER_PAGE, questions.length);
                const pageQuestions = questions.slice(start, end);
                let html = '';
                pageQuestions.forEach(q => {
                    const ans = answers[q.id];
                    const isAnswered = ans !== undefined;
                    const answeredClass = isAnswered ? ' answered' : '';
                    html += `<div class="question-item${answeredClass}">`;
                    html += `<span class="question-num">${q.id}</span>`;
                    html += `<span class="question-text">${q.text}</span>`;
                    html += `<div class="options-mini">`;
                    html +=
                        `<button class="option-pill${isAnswered && ans === true ? ' selected-yes' : ''}" data-qid="${q.id}" data-val="1">是</button>`;
                    html +=
                        `<button class="option-pill${isAnswered && ans === false ? ' selected-no' : ''}" data-qid="${q.id}" data-val="0">否</button>`;
                    html += `</div></div>`;
                });
                questionsCard.innerHTML = html;

                questionsCard.querySelectorAll('.option-pill').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const qid = parseInt(this.getAttribute('data-qid'));
                        const val = this.getAttribute('data-val') === '1';
                        if (answers[qid] === val) {
                            delete answers[qid];
                        } else {
                            answers[qid] = val;
                        }
                        saveAnswers();
                        renderCurrentPage();
                        updateProgress();
                    });
                });
                updateProgress();
                renderPageDots();
                questionsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                window.scrollBy(0, -70);
            }

            function updateProgress() {
                const total = questions.length;
                const answered = Object.keys(answers).length;
                const pct = Math.round((answered / total) * 100);
                progressBar.style.width = pct + '%';
                answeredCountEl.textContent = `已答 ${answered} 题`;
                progressLabel.textContent = `第 ${currentPage} 页 / 共 ${TOTAL_PAGES} 页`;
                btnPrev.disabled = currentPage === 1;
                if (currentPage === TOTAL_PAGES) {
                    btnNext.style.display = 'none';
                    submitRow.style.display = 'flex';
                } else {
                    btnNext.style.display = '';
                    submitRow.style.display = 'none';
                }
                btnSubmit.disabled = answered < total;
                if (answered === total && currentPage === TOTAL_PAGES) btnSubmit.disabled = false;
                renderPageDots();
            }

            function clearCurrentPage() {
                const start = (currentPage - 1) * QUESTIONS_PER_PAGE;
                const end = Math.min(start + QUESTIONS_PER_PAGE, questions.length);
                let cleared = false;
                for (let i = start; i < end; i++) {
                    if (answers[questions[i].id] !== undefined) { delete answers[questions[i].id];
                        cleared = true; }
                }
                if (cleared) { saveAnswers();
                    showToast('已清空本页答案'); } else { showToast('本页暂无已选答案'); }
                renderCurrentPage();
                updateProgress();
            }

            function submitAndShow() {
                const total = questions.length;
                if (Object.keys(answers).length < total) { showToast('请完成全部60道题目'); return; }

                // 计算各类型得分
                const scores = { choleric: 0, sanguine: 0, phlegmatic: 0, melancholic: 0 };
                questions.forEach(q => {
                    if (answers[q.id] === true) scores[q.type]++;
                });

                // 判断结果
                const maxScore = Math.max(...Object.values(scores));
                const typicalTypes = []; // ≥10分
                const tendencyTypes = []; // 7-9分
                for (const [t, s] of Object.entries(scores)) {
                    if (s >= 10) typicalTypes.push(t);
                    else if (s >= 7) tendencyTypes.push(t);
                }

                let conclusionTitle, conclusionText;
                if (typicalTypes.length === 1) {
                    const t = typicalTypes[0];
                    conclusionTitle = `典型${typeInfo[t].name}`;
                    conclusionText = `你的气质类型非常鲜明，属于典型的<b>${typeInfo[t].name}</b>。${typeInfo[t].desc}`;
                } else if (typicalTypes.length >= 2) {
                    const names = typicalTypes.map(t => typeInfo[t].name).join('+');
                    conclusionTitle = `${names}混合型`;
                    conclusionText =
                        `你兼具多种气质类型的特点，属于<b>${names}混合型</b>。这说明你的气质表现比较丰富，在不同情境下可能展现不同的特质。混合型气质往往具有更强的适应性。`;
                } else if (tendencyTypes.length >= 1) {
                    const names = tendencyTypes.map(t => typeInfo[t].name).join('、');
                    conclusionTitle = `倾向于${names}`;
                    conclusionText =
                        `你的气质类型有一定的倾向性，偏向于<b>${names}</b>，但特征不是非常突出。你可能会在不同情境中表现出灵活多样的反应方式。`;
                } else {
                    conclusionTitle = '气质类型不明显';
                    conclusionText =
                        '你的各项气质得分较为均衡，没有突出的倾向。这可能意味着你的气质表现比较平衡，或者你在不同情境中能够灵活调整自己的行为方式。';
                }

                // 显示结果
                resultsSection.classList.add('visible');
                resultDate.textContent = `测评时间：${new Date().toLocaleString('zh-CN')}`;

                let gridHTML = '';
                for (const [t, info] of Object.entries(typeInfo)) {
                    const s = scores[t];
                    let badgeHTML = '';
                    if (s >= 10) badgeHTML = '<span class="type-badge badge-typical">典型</span>';
                    else if (s >= 7) badgeHTML = '<span class="type-badge badge-tendency">倾向</span>';
                    else badgeHTML = '<span class="type-badge badge-none">不明显</span>';
                    gridHTML += `
                        <div class="type-card ${info.cssClass}">
                            <div class="type-icon">${info.icon}</div>
                            <div class="type-name">${info.name}</div>
                            <div class="type-eng">${info.eng}</div>
                            <div class="type-score">${s}</div>
                            <div class="type-max">/ 15 分</div>
                            ${badgeHTML}
                        </div>`;
                }
                typeGrid.innerHTML = gridHTML;
                resultConclusion.innerHTML = `
                    <div class="conclusion-title">📋 ${conclusionTitle}</div>
                    <div class="conclusion-text">${conclusionText}</div>`;

                // 锁定
                progressSection.style.opacity = '0.5';
                questionsCard.style.opacity = '0.5';
                navButtons.style.opacity = '0.5';
                submitRow.style.opacity = '0.5';
                questionsCard.style.pointerEvents = 'none';
                navButtons.style.pointerEvents = 'none';
                submitRow.style.pointerEvents = 'none';

                saveAnswers();
                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                window.scrollBy(0, -60);
            }

            function retakeTest() {
                if (confirm('确定要清除所有答案并重新测评吗？')) {
                    answers = {};
                    currentPage = 1;
                    localStorage.removeItem('temperament_answers');
                    resultsSection.classList.remove('visible');
                    progressSection.style.opacity = '1';
                    questionsCard.style.opacity = '1';
                    navButtons.style.opacity = '1';
                    submitRow.style.opacity = '1';
                    questionsCard.style.pointerEvents = 'auto';
                    navButtons.style.pointerEvents = 'auto';
                    submitRow.style.pointerEvents = 'auto';
                    renderCurrentPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }

            btnPrev.addEventListener('click', () => { if (currentPage > 1) { currentPage--;
                renderCurrentPage(); } });
            btnNext.addEventListener('click', () => { if (currentPage < TOTAL_PAGES) { currentPage++;
                renderCurrentPage(); } });
            btnClearPage.addEventListener('click', clearCurrentPage);
            btnSubmit.addEventListener('click', submitAndShow);
            btnRetake.addEventListener('click', retakeTest);

            document.addEventListener('keydown', function(e) {
                if (resultsSection.classList.contains('visible')) return;
                if (e.key === 'ArrowLeft' && !e.target.closest('input,textarea')) {
                    e.preventDefault();
                    if (currentPage > 1) { currentPage--;
                        renderCurrentPage(); }
                }
                if (e.key === 'ArrowRight' && !e.target.closest('input,textarea')) {
                    e.preventDefault();
                    if (currentPage < TOTAL_PAGES) { currentPage++;
                        renderCurrentPage(); }
                }
            });

            renderCurrentPage();
            console.log('🌈 气质类型量表已就绪 · 60题 · 四气质维度评估');
        })();
    </script>
</body>
</html>
