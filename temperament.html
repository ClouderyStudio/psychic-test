<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气质类型量表 - 心灵驿站</title>
    <style>
        :root {
            --bg: #f7f4f0;
            --card-bg: #ffffff;
            --text: #3a3540;
            --text-secondary: #6b6372;
            --text-muted: #9a919e;
            --primary: #5b8c9e;
            --primary-light: #e8f0f4;
            --primary-dark: #3d6a7c;
            --choleric: #c0392b;
            --choleric-light: #fdecea;
            --choleric-tag: #f5c6c0;
            --sanguine: #d4a843;
            --sanguine-light: #fef9f0;
            --sanguine-tag: #f0e0b8;
            --phlegmatic: #4a8c6f;
            --phlegmatic-light: #eaf5ef;
            --phlegmatic-tag: #c5e0d2;
            --melancholic: #5b6d9e;
            --melancholic-light: #eef1f8;
            --melancholic-tag: #d0d6ec;
            --shadow-sm: 0 1px 3px rgba(58, 53, 64, 0.05), 0 1px 2px rgba(58, 53, 64, 0.04);
            --shadow-md: 0 4px 16px rgba(58, 53, 64, 0.07), 0 2px 6px rgba(58, 53, 64, 0.04);
            --shadow-lg: 0 8px 30px rgba(58, 53, 64, 0.10), 0 3px 10px rgba(58, 53, 64, 0.05);
            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system,
                sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 15% 10%, rgba(91, 140, 158, 0.03) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 90%, rgba(123, 107, 142, 0.03) 0%, transparent 55%);
            background-attachment: fixed;
        }
        .top-bar {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(58, 53, 64, 0.06);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-bar-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 7px 14px;
            border-radius: 20px;
            transition: var(--transition);
            background: var(--primary-light);
            white-space: nowrap;
        }
        .back-link:hover {
            background: #d4e6ef;
            color: #2c5668;
        }
        .scale-label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            text-align: right;
            letter-spacing: 0.02em;
            line-height: 1.3;
        }
        .scale-label small {
            display: block;
            font-weight: 400;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .page-header {
            text-align: center;
            padding: 32px 0 20px;
        }
        .page-header h1 {
            font-size: clamp(1.3rem, 2.5vw, 1.7rem);
            font-weight: 700;
            color: #2c2633;
            margin-bottom: 6px;
        }
        .page-header .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .progress-section {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(58, 53, 64, 0.05);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .progress-bar-outer {
            width: 100%;
            height: 8px;
            background: #e8e3ec;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #5b8c9e 0%, #7bafc0 100%);
            border-radius: 10px;
            transition: width 0.35s ease;
            width: 0%;
        }
        .page-dots {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
            justify-content: center;
        }
        .page-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d8d2de;
            cursor: pointer;
            border: none;
            padding: 0;
            transition: var(--transition);
        }
        .page-dot.completed {
            background: #a0c4d1;
        }
        .page-dot.active {
            background: var(--primary);
            width: 22px;
            border-radius: 10px;
        }
        .questions-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px 22px 14px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(58, 53, 64, 0.05);
            margin-bottom: 16px;
        }
        .question-item {
            padding: 10px 0;
            border-bottom: 1px solid #f0edf3;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            transition: var(--transition);
        }
        .question-item:last-child {
            border-bottom: none;
        }
        .question-item.answered {
            background: #fdfcfe;
            margin: 0 -12px;
            padding-left: 12px;
            padding-right: 12px;
            border-radius: 8px;
        }
        .question-num {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 0.7rem;
            width: 23px;
            height: 23px;
            line-height: 23px;
            text-align: center;
            border-radius: 50%;
            margin-right: 6px;
            flex-shrink: 0;
        }
        .question-text {
            flex: 1;
            font-weight: 500;
            font-size: 0.88rem;
            color: #2c2633;
            min-width: 200px;
            letter-spacing: 0.01em;
            line-height: 1.4;
        }
        .options-mini {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }
        .option-pill {
            padding: 6px 16px;
            border-radius: 15px;
            border: 1.5px solid #e0dbe4;
            background: #fff;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .option-pill:hover {
            border-color: #c5bdd0;
            background: #faf9fb;
        }
        .option-pill.selected-yes {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            font-weight: 600;
        }
        .option-pill.selected-no {
            background: #e8e3ec;
            color: #5a4e66;
            border-color: #c5bdd0;
            font-weight: 600;
        }
        .nav-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 12px 28px;
            border-radius: 24px;
            border: 1.5px solid #d8d2de;
            background: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            transition: var(--transition);
            font-family: var(--font-sans);
            letter-spacing: 0.03em;
            box-shadow: var(--shadow-sm);
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .nav-btn:hover:not(:disabled) {
            border-color: #b8b0c0;
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f5f3f7;
        }
        .nav-btn.submit-btn {
            background: #3d5a4f;
            color: #fff;
            border-color: #3d5a4f;
        }
        .nav-btn.submit-btn:hover:not(:disabled) {
            background: #2f4840;
        }
        .nav-btn.clear-btn {
            color: #c0392b;
            border-color: #e8c8c0;
        }
        .nav-btn.clear-btn:hover {
            background: #fdecea;
        }
        .results-section {
            display: none;
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 28px 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(58, 53, 64, 0.06);
            margin-bottom: 32px;
        }
        .results-section.visible {
            display: block;
            animation: fadeInUp 0.45s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .results-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .results-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c2633;
        }
        .results-header .result-date {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .type-card {
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(58, 53, 64, 0.08);
        }
        .type-card.choleric {
            background: var(--choleric-light);
            border-color: var(--choleric-tag);
        }
        .type-card.sanguine {
            background: var(--sanguine-light);
            border-color: var(--sanguine-tag);
        }
        .type-card.phlegmatic {
            background: var(--phlegmatic-light);
            border-color: var(--phlegmatic-tag);
        }
        .type-card.melancholic {
            background: var(--melancholic-light);
            border-color: var(--melancholic-tag);
        }
        .type-card .type-icon {
            font-size: 1.8rem;
            margin-bottom: 2px;
        }
        .type-card .type-name {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }
        .type-card .type-eng {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.03em;
        }
        .type-card .type-score {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .type-card .type-max {
            font-size: 0.65rem;
            color: var(--text-muted);
        }
        .type-card .type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            margin-top: 4px;
        }
        .badge-typical {
            background: #d4e6ef;
            color: #2c5668;
        }
        .badge-tendency {
            background: #fef9f0;
            color: #8b6919;
        }
        .badge-none {
            background: #f0edf3;
            color: #6b6372;
        }
        .result-conclusion {
            background: #faf8fc;
            border-radius: var(--radius);
            padding: 18px;
            text-align: center;
            border: 1px solid #eeeaf2;
            margin: 16px 0;
        }
        .result-conclusion .conclusion-title {
            font-weight: 700;
            font-size: 1rem;
            color: #2c2633;
        }
        .result-conclusion .conclusion-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 6px;
        }
        .disclaimer {
            background: #fef9f0;
            border: 1px solid #f0d89c;
            border-radius: var(--radius);
            padding: 14px 18px;
            font-size: 0.82rem;
            color: #8b6d3b;
            line-height: 1.6;
            margin-top: 16px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .disclaimer-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.75rem;
            border-top: 1px solid rgba(58, 53, 64, 0.05);
        }
        .footer a {
            color: var(--primary-dark);
            text-decoration: none;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #3a3540;
            color: #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            box-shadow: var(--shadow-lg);
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(4px);
        }
        @media (max-width: 600px) {
            .questions-card {
                padding: 14px 10px 8px;
            }
            .question-text {
                font-size: 0.8rem;
            }
            .option-pill {
                padding: 5px 12px;
                font-size: 0.7rem;
            }
            .nav-btn {
                padding: 10px 16px;
                font-size: 0.8rem;
            }
            .type-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
        }
    </style>
</head>

    <header class="top-bar">

            <div style="text-align:center;margin-top:16px;">

            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <a href="index.html">← 返回量表目录</a> · 心灵驿站 - 心理测评中心
    </footer>

                { id: 45, text: '和周围人们的关系总是相处不好', type: 'choleric' },
                // 第4页 (46-60)
                { id: 46, text: '能够同时注意几件事情', type: 'sanguine' },
                { id: 47, text: '认为墨守成规比冒风险强些', type: 'phlegmatic' },
                { id: 48, text: '烦闷时别人很难使我高兴起来', type: 'melancholic' },
                { id: 49, text: '别人说我"出语伤人"，可我并不觉得这样', type: 'choleric' },
                { id: 50, text: '希望做变化大、花样多的工作', type: 'sanguine' },
                { id: 51, text: '对工作抱认真严谨、始终一贯的态度', type: 'phlegmatic' },
                { id: 52, text: '喜欢复习学过的知识，重复做已经掌握的工作', type: 'melancholic' },
                { id: 53, text: '兴奋的事常使我失眠', type: 'choleric' },
                { id: 54, text: '反应敏捷，头脑机智', type: 'sanguine' },
                { id: 55, text: '在体育活动中，常因反应慢而落后', type: 'phlegmatic' },
                { id: 56, text: '小时候会背的诗歌，似乎比别人记得更清楚', type: 'melancholic' },
                { id: 57, text: '羡慕那种善于克制自己感情的人', type: 'choleric' },
                { id: 58, text: '假如工作枯燥无味，马上就会情绪低落', type: 'sanguine' },
                { id: 59, text: '喜欢有条理而不甚麻烦的工作', type: 'phlegmatic' },
                { id: 60, text: '老师讲新概念常常听不懂，但弄懂后很难忘记', type: 'melancholic' },
            ];

            const QUESTIONS_PER_PAGE = 15;
            const TOTAL_PAGES = Math.ceil(questions.length / QUESTIONS_PER_PAGE); // 4

            // 气质类型信息
            const typeInfo = {
                choleric: {
                    name: '胆汁质',
                    eng: 'Choleric',
                    icon: '🔥',
                    cssClass: 'choleric',
                    desc: '精力旺盛，热情直率，做事果断，但容易冲动，脾气急躁，情绪变化剧烈。优点包括积极主动、勇敢果断；不足是可能缺乏耐心、容易发怒。',
                },
                sanguine: {
                    name: '多血质',
                    eng: 'Sanguine',
                    icon: '🌻',
                    cssClass: 'sanguine',
                    desc: '活泼好动，反应迅速，善于交际，适应能力强，但注意力容易转移，兴趣多变。优点是乐观开朗、灵活机敏；不足是可能缺乏持久性、容易浮躁。',
                },
                phlegmatic: {
                    name: '黏液质',
                    eng: 'Phlegmatic',
                    icon: '💧',
                    cssClass: 'phlegmatic',
                    desc: '安静稳重，沉着坚定，善于克制，生活有规律，但反应较慢，不够灵活。优点是踏实可靠、有耐心；不足是可能过于保守、缺乏活力。',
                },
                melancholic: {
                    name: '抑郁质',
                    eng: 'Melancholic',
                    icon: '🌙',
                    cssClass: 'melancholic',
                    desc: '情感细腻，观察敏锐，体验深刻，但敏感多疑，容易忧虑，行动迟缓。优点是富有同理心、思考深入；不足是可能过于内向、容易陷入负面情绪。',
                },
            };

            // 状态
            let answers = {}; // { questionId: true(是) / false(否) }
            let currentPage = 1;
            const saved = localStorage.getItem('temperament_answers');
            if (saved) {
                try {
                    const p = JSON.parse(saved);
                    if (p && typeof p === 'object') answers = p;
                } catch (e) { answers = {}; }
            }

            const questionsCard = document.getElementById('questionsCard');
            const progressBar = document.getElementById('progressBar');
            const answeredCountEl = document.getElementById('answeredCount');
            const progressLabel = document.getElementById('progressLabel');
            const pageDotsEl = document.getElementById('pageDots');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnClearPage = document.getElementById('btnClearPage');
            const btnSubmit = document.getElementById('btnSubmit');
            const submitRow = document.getElementById('submitRow');
            const navButtons = document.getElementById('navButtons');
            const resultsSection = document.getElementById('resultsSection');
            const typeGrid = document.getElementById('typeGrid');
            const resultConclusion = document.getElementById('resultConclusion');
            const resultDate = document.getElementById('resultDate');
            const btnRetake = document.getElementById('btnRetake');
            const toast = document.getElementById('toast');
            const progressSection = document.getElementById('progressSection');

            let toastTimer;

            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function saveAnswers() { localStorage.setItem('temperament_answers', JSON.stringify(answers)); }

            function renderPageDots() {
                let html = '';
                for (let i = 1; i <= TOTAL_PAGES; i++) {
                    let cls = 'page-dot';
                    if (i === currentPage) cls += ' active';
                    const start = (i - 1) * QUESTIONS_PER_PAGE;
                    const end = Math.min(i * QUESTIONS_PER_PAGE, questions.length);
                    let hasAnswer = false;
                    for (let j = start; j < end; j++) {
                        if (answers[questions[j].id] !== undefined) { hasAnswer = true; break; }
                    }
                    if (hasAnswer && i !== currentPage) cls += ' completed';
                    html += `<button class="${cls}" data-page="${i}" aria-label="跳转到第${i}页" title="第${i}页"></button>`;
                }
                pageDotsEl.innerHTML = html;
                pageDotsEl.querySelectorAll('.page-dot').forEach(dot => {
                    dot.addEventListener('click', function() {
                        const p = parseInt(this.getAttribute('data-page'));
                        if (p !== currentPage) { currentPage = p;
                            renderCurrentPage(); }
                    });
                });
            }

            function renderCurrentPage() {
                const start = (currentPage - 1) * QUESTIONS_PER_PAGE;
                const end = Math.min(start + QUESTIONS_PER_PAGE, questions.length);
                const pageQuestions = questions.slice(start, end);
                let html = '';
                pageQuestions.forEach(q => {
                    const ans = answers[q.id];
                    const isAnswered = ans !== undefined;
                    const answeredClass = isAnswered ? ' answered' : '';
                    html += `<div class="question-item${answeredClass}">`;
                    html += `<span class="question-num">${q.id}</span>`;
                    html += `<span class="question-text">${q.text}</span>`;
                    html += `<div class="options-mini">`;
                    html +=
                        `<button class="option-pill${isAnswered && ans === true ? ' selected-yes' : ''}" data-qid="${q.id}" data-val="1">是</button>`;
                    html +=
                        `<button class="option-pill${isAnswered && ans === false ? ' selected-no' : ''}" data-qid="${q.id}" data-val="0">否</button>`;
                    html += `</div></div>`;
                });
                questionsCard.innerHTML = html;

                questionsCard.querySelectorAll('.option-pill').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const qid = parseInt(this.getAttribute('data-qid'));
                        const val = this.getAttribute('data-val') === '1';
                        if (answers[qid] === val) {
                            delete answers[qid];
                        } else {
                            answers[qid] = val;
                        }
                        saveAnswers();
                        renderCurrentPage();
                        updateProgress();
                    });
                });
                updateProgress();
                renderPageDots();
                questionsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                window.scrollBy(0, -70);
            }

            function updateProgress() {
                const total = questions.length;
                const answered = Object.keys(answers).length;
                const pct = Math.round((answered / total) * 100);
                progressBar.style.width = pct + '%';
                answeredCountEl.textContent = `已答 ${answered} 题`;
                progressLabel.textContent = `第 ${currentPage} 页 / 共 ${TOTAL_PAGES} 页`;
                btnPrev.disabled = currentPage === 1;
                if (currentPage === TOTAL_PAGES) {
                    btnNext.style.display = 'none';
                    submitRow.style.display = 'flex';
                } else {
                    btnNext.style.display = '';
                    submitRow.style.display = 'none';
                }
                btnSubmit.disabled = answered < total;
                if (answered === total && currentPage === TOTAL_PAGES) btnSubmit.disabled = false;
                renderPageDots();
            }

            function clearCurrentPage() {
                const start = (currentPage - 1) * QUESTIONS_PER_PAGE;
                const end = Math.min(start + QUESTIONS_PER_PAGE, questions.length);
                let cleared = false;
                for (let i = start; i < end; i++) {
                    if (answers[questions[i].id] !== undefined) { delete answers[questions[i].id];
                        cleared = true; }
                }
                if (cleared) { saveAnswers();
                    showToast('已清空本页答案'); } else { showToast('本页暂无已选答案'); }
                renderCurrentPage();
                updateProgress();
            }

            function submitAndShow() {
                const total = questions.length;
                if (Object.keys(answers).length < total) { showToast('请完成全部60道题目'); return; }

                // 计算各类型得分
                const scores = { choleric: 0, sanguine: 0, phlegmatic: 0, melancholic: 0 };
                questions.forEach(q => {
                    if (answers[q.id] === true) scores[q.type]++;
                });

                // 判断结果
                const maxScore = Math.max(...Object.values(scores));
                const typicalTypes = []; // ≥10分
                const tendencyTypes = []; // 7-9分
                for (const [t, s] of Object.entries(scores)) {
                    if (s >= 10) typicalTypes.push(t);
                    else if (s >= 7) tendencyTypes.push(t);
                }

                let conclusionTitle, conclusionText;
                if (typicalTypes.length === 1) {
                    const t = typicalTypes[0];
                    conclusionTitle = `典型${typeInfo[t].name}`;
                    conclusionText = `你的气质类型非常鲜明，属于典型的<b>${typeInfo[t].name}</b>。${typeInfo[t].desc}`;
                } else if (typicalTypes.length >= 2) {
                    const names = typicalTypes.map(t => typeInfo[t].name).join('+');
                    conclusionTitle = `${names}混合型`;
                    conclusionText =
                        `你兼具多种气质类型的特点，属于<b>${names}混合型</b>。这说明你的气质表现比较丰富，在不同情境下可能展现不同的特质。混合型气质往往具有更强的适应性。`;
                } else if (tendencyTypes.length >= 1) {
                    const names = tendencyTypes.map(t => typeInfo[t].name).join('、');
                    conclusionTitle = `倾向于${names}`;
                    conclusionText =
                        `你的气质类型有一定的倾向性，偏向于<b>${names}</b>，但特征不是非常突出。你可能会在不同情境中表现出灵活多样的反应方式。`;
                } else {
                    conclusionTitle = '气质类型不明显';
                    conclusionText =
                        '你的各项气质得分较为均衡，没有突出的倾向。这可能意味着你的气质表现比较平衡，或者你在不同情境中能够灵活调整自己的行为方式。';
                }

                // 显示结果
                resultsSection.classList.add('visible');
                resultDate.textContent = `测评时间：${new Date().toLocaleString('zh-CN')}`;

                let gridHTML = '';
                for (const [t, info] of Object.entries(typeInfo)) {
                    const s = scores[t];
                    let badgeHTML = '';
                    if (s >= 10) badgeHTML = '<span class="type-badge badge-typical">典型</span>';
                    else if (s >= 7) badgeHTML = '<span class="type-badge badge-tendency">倾向</span>';
                    else badgeHTML = '<span class="type-badge badge-none">不明显</span>';
                    gridHTML += `
                        <div class="type-card ${info.cssClass}">
                            <div class="type-icon">${info.icon}</div>
                            <div class="type-name">${info.name}</div>
                            <div class="type-eng">${info.eng}</div>
                            <div class="type-score">${s}</div>
                            <div class="type-max">/ 15 分</div>
                            ${badgeHTML}
                        </div>`;
                }
                typeGrid.innerHTML = gridHTML;
                resultConclusion.innerHTML = `
                    <div class="conclusion-title">📋 ${conclusionTitle}</div>
                    <div class="conclusion-text">${conclusionText}</div>`;

                // 锁定
                progressSection.style.opacity = '0.5';
                questionsCard.style.opacity = '0.5';
                navButtons.style.opacity = '0.5';
                submitRow.style.opacity = '0.5';
                questionsCard.style.pointerEvents = 'none';
                navButtons.style.pointerEvents = 'none';
                submitRow.style.pointerEvents = 'none';

                saveAnswers();
                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                window.scrollBy(0, -60);
            }

            function retakeTest() {
                if (confirm('确定要清除所有答案并重新测评吗？')) {
                    answers = {};
                    currentPage = 1;
                    localStorage.removeItem('temperament_answers');
                    resultsSection.classList.remove('visible');
                    progressSection.style.opacity = '1';
                    questionsCard.style.opacity = '1';
                    navButtons.style.opacity = '1';
                    submitRow.style.opacity = '1';
                    questionsCard.style.pointerEvents = 'auto';
                    navButtons.style.pointerEvents = 'auto';
                    submitRow.style.pointerEvents = 'auto';
                    renderCurrentPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }

            btnPrev.addEventListener('click', () => { if (currentPage > 1) { currentPage--;
                renderCurrentPage(); } });
            btnNext.addEventListener('click', () => { if (currentPage < TOTAL_PAGES) { currentPage++;
                renderCurrentPage(); } });
            btnClearPage.addEventListener('click', clearCurrentPage);
            btnSubmit.addEventListener('click', submitAndShow);
            btnRetake.addEventListener('click', retakeTest);

            document.addEventListener('keydown', function(e) {
                if (resultsSection.classList.contains('visible')) return;
                if (e.key === 'ArrowLeft' && !e.target.closest('input,textarea')) {
                    e.preventDefault();
                    if (currentPage > 1) { currentPage--;
                        renderCurrentPage(); }
                }
                if (e.key === 'ArrowRight' && !e.target.closest('input,textarea')) {
                    e.preventDefault();
                    if (currentPage < TOTAL_PAGES) { currentPage++;
                        renderCurrentPage(); }
                }
            });

            renderCurrentPage();
            console.log('🌈 气质类型量表已就绪 · 60题 · 四气质维度评估');
        })();
    </script>
</body>
</html>
