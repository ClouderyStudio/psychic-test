                {id:181,text:'我遇事常能冷静处理，不轻易发怒:',options:['是的','介于A与C之间','不是的'],factor:'C',reverse:false},
                {id:182,text:'我认为只要双方友好，离婚是合理的:',options:['是的','介于A与C之间','不是的'],factor:'Q1',reverse:false},
                {id:183,text:'本题后列有三个单词，哪个与其他两个不同类:',options:['狗','石头','牛'],factor:'B',reverse:false},
                {id:184,text:'假使我手里拿着装有子弹的手枪，我必须取出子弹才安心:',options:['是的','介于A与C之间','不是的'],factor:'G',reverse:false},
                {id:185,text:'我不喜欢那些自以为是、目空一切的人:',options:['是的','介于A与C之间','不是的'],factor:'E',reverse:true},
                {id:186,text:'在年轻的时候，我和父母的意见经常不一致:',options:['是的','不一定','不是的'],factor:'E',reverse:false},
                {id:187,text:'我很容易与周围的人融洽相处:',options:['是的','介于A与C之间','不是的'],factor:'A',reverse:false}
            ];

            // 因子列表与名称
            const factorNames = {
                A:'乐群性', B:'智慧性', C:'稳定性', E:'影响性', F:'活泼性', G:'有恒性',
                H:'交际性', I:'情感性', L:'怀疑性', M:'想象性', N:'世故性', O:'忧虑性',
                Q1:'变革性', Q2:'独立性', Q3:'自律性', Q4:'紧张性'
            };

            // 状态
            const QUESTIONS_PER_PAGE = 10;
            const totalPages = Math.ceil(questions.length / QUESTIONS_PER_PAGE);
            let answers = {};
            let currentPage = 1;

            const saved = localStorage.getItem('16pf_answers');
            if(saved){ try{ const p=JSON.parse(saved); if(p) answers=p; }catch(e){} }

            const questionsCard = document.getElementById('questionsCard');
            const progressBar = document.getElementById('progressBar');
            const answeredCountEl = document.getElementById('answeredCount');
            const progressText = document.getElementById('progressText');
            const pageNav = document.getElementById('pageNav');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnClearPage = document.getElementById('btnClearPage');
            const btnSubmit = document.getElementById('btnSubmit');
            const resultsSection = document.getElementById('resultsSection');
            const resultDate = document.getElementById('resultDate');
            const factorGrid = document.getElementById('factorGrid');
            const btnRetake = document.getElementById('btnRetake');

            function saveAnswers(){ localStorage.setItem('16pf_answers', JSON.stringify(answers)); }

            function renderPageNav(){
                let html = '';
                for(let i=1;i<=totalPages;i++){
                    let cls = 'page-btn';
                    if(i===currentPage) cls += ' active';
                    const start=(i-1)*QUESTIONS_PER_PAGE, end=Math.min(i*QUESTIONS_PER_PAGE,questions.length);
                    let answeredCount=0;
                    for(let j=start;j<end;j++) if(answers[questions[j].id]!==undefined) answeredCount++;
                    if(answeredCount>0 && i!==currentPage) cls+=' completed';
                    html += '<button class="'+cls+'" data-page="'+i+'">'+i+'</button>';
                }
                pageNav.innerHTML = html;
                pageNav.querySelectorAll('.page-btn').forEach(btn=>{
                    btn.addEventListener('click',function(){
                        const p = parseInt(this.dataset.page);
                        if(p!==currentPage){ currentPage=p; renderCurrentPage(); }
                    });
                });
            }

            function renderCurrentPage(){
                const start = (currentPage-1)*QUESTIONS_PER_PAGE;
                const end = Math.min(start+QUESTIONS_PER_PAGE, questions.length);
                const pageQuestions = questions.slice(start,end);
                let html = '';
                pageQuestions.forEach(q=>{
                    const selected = answers[q.id];
                    const opts = q.options || ['A. 是的','B. 介于A与C之间','C. 不是的'];
                    html += '<div class="question-item"><span class="question-num">'+q.id+'</span><span class="question-text">'+q.text+'</span>';
                    html += '<div class="options-row">';
                    opts.forEach((opt,idx)=>{
                        const selClass = (selected===idx) ? ' selected' : '';
                        html += '<button class="option-btn'+selClass+'" data-qid="'+q.id+'" data-opt="'+idx+'">'+opt+'</button>';
                    });
                    html += '</div></div>';
                });
                questionsCard.innerHTML = html;
                questionsCard.querySelectorAll('.option-btn').forEach(btn=>{
                    btn.addEventListener('click',function(){
                        const qid = parseInt(this.dataset.qid);
                        const opt = parseInt(this.dataset.opt);
                        if(answers[qid]===opt){ delete answers[qid]; }
                        else { answers[qid] = opt; }
                        saveAnswers();
                        renderCurrentPage();
                        updateProgress();
                    });
                });
                updateProgress();
                renderPageNav();
                btnPrev.disabled = currentPage===1;
                btnNext.style.display = currentPage===totalPages ? 'none' : '';
                if(currentPage===totalPages){
                    document.querySelector('.nav-buttons:last-of-type').style.display='flex';
                }else{
                    document.querySelector('.nav-buttons:last-of-type').style.display='none';
                }
            }

            function updateProgress(){
                const total = questions.length;
                const answered = Object.keys(answers).length;
                const pct = Math.round((answered/total)*100);
                progressBar.style.width = pct+'%';
                answeredCountEl.textContent = '已答'+answered+'题';
                progressText.textContent = '第'+currentPage+'页/共'+totalPages+'页';
                btnSubmit.disabled = answered < total;
            }

            function clearPage(){
                const start=(currentPage-1)*QUESTIONS_PER_PAGE, end=Math.min(start+QUESTIONS_PER_PAGE,questions.length);
                let cleared=false;
                for(let i=start;i<end;i++){ if(answers[questions[i].id]!==undefined){ delete answers[questions[i].id]; cleared=true; } }
                if(cleared){ saveAnswers(); renderCurrentPage(); } else { alert('本页暂无答案'); }
            }

            function calcResults(){
                const scores = {};
                for(const f in factorNames) scores[f] = 0;
                questions.forEach(q=>{
                    const ans = answers[q.id];
                    if(ans===undefined) return;
                    let score = ans;
                    if(q.reverse) score = 2 - ans;
                    scores[q.factor] += score;
                });
                const desc = {
                    A:'高分：外向、热情、乐群 / 低分：缄默、孤独、冷漠',
                    B:'高分：聪明、富有才识 / 低分：迟钝、学识浅薄',
                    C:'高分：情绪稳定、成熟 / 低分：情绪激动、易烦恼',
                    E:'高分：好强、固执、独立 / 低分：谦逊、顺从、通融',
                    F:'高分：活泼、愉快、健谈 / 低分：严肃、审慎、寡言',
                    G:'高分：有恒负责、做事尽职 / 低分：权宜敷衍、原则性差',
                    H:'高分：冒险敢为、社交大胆 / 低分：畏怯退缩、缺乏自信',
                    I:'高分：敏感、感情用事 / 低分：理智、着重现实',
                    L:'高分：怀疑、刚愎、固执己见 / 低分：信赖、随和、易与人相处',
                    M:'高分：幻想、狂放任性 / 低分：现实、合乎成规、力求妥善',
                    N:'高分：精明能干、世故 / 低分：坦白、直率、天真',
                    O:'高分：忧虑抑郁、烦恼自扰 / 低分：安详、沉着、有自信心',
                    Q1:'高分：自由、批评激进 / 低分：保守、尊重传统',
                    Q2:'高分：自立、当机立断 / 低分：依赖、随群附众',
                    Q3:'高分：知己知彼、自律谨严 / 低分：矛盾冲突、不顾大体',
                    Q4:'高分：紧张困扰、激动挣扎 / 低分：心平气和、闲散宁静'
                };
                return { scores, desc };
            }

            function submitAndShow(){
                if(Object.keys(answers).length < questions.length) { alert('请完成所有题目'); return; }
                const {scores, desc} = calcResults();
                resultsSection.classList.add('visible');
                resultDate.textContent = '测评时间：'+new Date().toLocaleString();
                let html = '';
                for(const f in factorNames){
                    const s = scores[f];
                    html += '<div class="factor-card"><span class="factor-code">'+f+'</span> <span class="factor-name">'+factorNames[f]+'</span><div class="factor-score">'+s+' 分</div><div class="factor-desc">'+desc[f]+'</div></div>';
                }
                factorGrid.innerHTML = html;
                document.querySelector('.questions-card').style.opacity='0.5';
                document.querySelector('.nav-buttons').style.opacity='0.5';
                document.querySelector('.nav-buttons:last-of-type').style.opacity='0.5';
            }

            btnPrev.addEventListener('click',()=>{ if(currentPage>1){ currentPage--; renderCurrentPage(); } });
            btnNext.addEventListener('click',()=>{ if(currentPage<totalPages){ currentPage++; renderCurrentPage(); } });
            btnClearPage.addEventListener('click',clearPage);
            btnSubmit.addEventListener('click',submitAndShow);
            btnRetake.addEventListener('click',()=>{
                if(confirm('确定重新测评吗？')){ answers={}; localStorage.removeItem('16pf_answers');
                    resultsSection.classList.remove('visible'); currentPage=1;
                    document.querySelector('.questions-card').style.opacity='1';
                    document.querySelectorAll('.nav-buttons').forEach(el=>el.style.opacity='1');
                    renderCurrentPage(); }
            });

            renderCurrentPage();
        })();
    </script>
