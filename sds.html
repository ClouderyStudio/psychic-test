<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDS 抑郁自评量表 - 心灵驿站</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* SDS 独有样式 */
        .progress-section .reverse-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="back-link" aria-label="返回量表目录">← 目录</a>
            <div class="scale-label">
                SDS 抑郁自评量表
                <small>Self-Rating Depression Scale</small>
            </div>
        </div>
    </header>

    <main class="container" id="mainContent">
        <div class="page-header">
            <h1>💙 SDS 抑郁自评量表</h1>
            <p class="subtitle">评估最近一周的情绪状态 · 共20题 · 约4-6分钟</p>
        </div>

        <!-- 进度区域 -->
        <div class="progress-section" id="progressSection">
            <div class="progress-info">
                <span id="progressLabel">请认真阅读每一条目，选择最符合你最近一周感受的选项</span>
                <span id="answeredCount">已答 0 题</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%;"></div>
            </div>
            <div class="reverse-hint">
                ⚡ 标注 <span class="reverse-badge">反向</span> 的题目计分方式与其它题目相反
            </div>
        </div>

        <!-- 答题卡片 -->
        <div class="questions-card" id="questionsCard"></div>

        <!-- 按钮 -->
        <div class="nav-buttons" id="navButtons">
            <button class="nav-btn clear-btn" id="btnClear">🔄 清空全部答案</button>
            <button class="nav-btn submit-btn" id="btnSubmit" disabled>✅ 提交答卷 · 查看结果</button>
        </div>

        <!-- 结果区域 -->
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>📊 测评结果报告</h2>
                <span class="result-date" id="resultDate"></span>
            </div>
            <div class="result-summary" id="resultSummary"></div>
            <div id="resultLevelContainer"></div>
            <div id="crisisAlertContainer"></div>
            <div class="disclaimer">
                <span class="disclaimer-icon">⚠️</span>
                <span><strong>重要提醒：</strong>本量表为自我筛查工具，结果仅供自我参考，<strong>不能替代专业心理医生的诊断</strong>。如果你对结果感到担忧，请咨询专业医生或拨打心理援助热线 <strong>12320-5</strong>。</span>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <button class="nav-btn" id="btnRetake">🔄 重新测评</button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <a href="index.html">← 返回量表目录</a> · 心灵驿站 - 心理测评中心
    </footer>

    <script src="common.js"></script>
    <script>
        (function() {
            // SDS 题目数据 (20题)
            var questions = [
                { id: 1, text: '我觉得闷闷不乐，情绪低沉', reversed: false },
                { id: 2, text: '我觉得一天之中早晨最好', reversed: true },
                { id: 3, text: '我一阵阵哭出来或觉得想哭', reversed: false },
                { id: 4, text: '我晚上睡眠不好', reversed: false },
                { id: 5, text: '我吃得跟平常一样多', reversed: true },
                { id: 6, text: '我与异性密切接触时和以往一样感到愉快', reversed: true },
                { id: 7, text: '我发觉我的体重在下降', reversed: false },
                { id: 8, text: '我有便秘的苦恼', reversed: false },
                { id: 9, text: '我心跳比平时快', reversed: false },
                { id: 10, text: '我无缘无故地感到疲乏', reversed: false },
                { id: 11, text: '我的头脑跟平常一样清楚', reversed: true },
                { id: 12, text: '我觉得经常做的事情并没有困难', reversed: true },
                { id: 13, text: '我觉得不安而平静不下来', reversed: false },
                { id: 14, text: '我对将来抱有希望', reversed: true },
                { id: 15, text: '我比平常容易生气激动', reversed: false },
                { id: 16, text: '我觉得作出决定是容易的', reversed: true },
                { id: 17, text: '我觉得自己是个有用的人，有人需要我', reversed: true },
                { id: 18, text: '我的生活过得很有意思', reversed: true },
                { id: 19, text: '我认为如果我死了别人会生活得好些', reversed: false },
                { id: 20, text: '平常感兴趣的事我仍然照样感兴趣', reversed: true },
            ];

            var options = [
                { label: '没有或很少时间', short: '很少', scoreForward: 1 },
                { label: '少部分时间', short: '有时', scoreForward: 2 },
                { label: '相当多时间', short: '经常', scoreForward: 3 },
                { label: '绝大部分或全部时间', short: '总是', scoreForward: 4 },
            ];

            var engine = new ScaleEngine({
                questions: questions,
                options: options,
                storageKey: 'sds_answers',
                scaleName: 'SDS 抑郁自评量表',
                onSubmit: function(eng) {
                    // 计算原始总分
                    var rawScore = 0;
                    eng.questions.forEach(function(q) {
                        rawScore += eng.getScore(q, eng.answers[q.id]);
                    });
                    // 标准分 = 原始分 * 1.25
                    var standardScore = Math.round(rawScore * 1.25);

                    // 分级
                    var levelText, levelClass;
                    if (standardScore < 50) {
                        levelText = '正常范围';
                        levelClass = 'normal';
                    } else if (standardScore <= 59) {
                        levelText = '轻度抑郁';
                        levelClass = 'mild';
                    } else if (standardScore <= 69) {
                        levelText = '中度抑郁';
                        levelClass = 'moderate';
                    } else {
                        levelText = '重度抑郁';
                        levelClass = 'severe';
                    }

                    var warning = standardScore >= 50;
                    eng.resultSummary.innerHTML =
                        '<div class="result-stat ' + (warning ? 'warning' : '') + '">' +
                            '<div class="stat-val">' + rawScore + '</div>' +
                            '<div class="stat-lbl">原始总分 (20-80)</div>' +
                        '</div>' +
                        '<div class="result-stat ' + (warning ? 'warning' : '') + '">' +
                            '<div class="stat-val">' + standardScore + '</div>' +
                            '<div class="stat-lbl">标准分 (原始分×1.25)</div>' +
                        '</div>';

                    eng.resultLevelContainer.innerHTML =
                        '<div class="result-level ' + levelClass + '">' + levelText + '</div>';

                    // 危机预警：第19题（认为如果我死了别人会生活得好些）得分偏高
                    var q19Fwd = eng.answers[19];
                    var crisisHTML = '';
                    if (q19Fwd && q19Fwd >= 3) {
                        crisisHTML =
                            '<div class="crisis-alert">' +
                                '<span class="crisis-icon">🆘</span>' +
                                '<div>' +
                                    '<strong>危机提醒：</strong>你在涉及生命意义的题目上得分较高，如果你正在经历情绪困扰或有伤害自己的想法，请<strong>立即</strong>寻求帮助。<br>' +
                                    '📞 <strong>全国心理援助热线：12320-5</strong>　|　📞 <strong>北京心理危机干预中心：010-82951332</strong>' +
                                '</div>' +
                            '</div>';
                    }
                    eng.crisisAlertContainer.innerHTML = crisisHTML;

                    eng.lockAnswerArea();
                    eng.showResults();
                }
            });

            engine.init();
        })();
    </script>
</body>
</html>
