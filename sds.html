<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDS 抑郁自评量表 - 心灵驿站</title>
    <style>
        :root {
            --bg: #f7f4f0;
            --card-bg: #ffffff;
            --text: #3a3540;
            --text-secondary: #6b6372;
            --text-muted: #9a919e;
            --primary: #5b8c9e;
            --primary-light: #e8f0f4;
            --primary-dark: #3d6a7c;
            --accent: #c97d60;
            --accent-light: #fdf2ed;
            --danger: #c0392b;
            --danger-light: #fdecea;
            --success: #4a8c6f;
            --success-light: #eaf5ef;
            --warning-bg: #fef9f0;
            --warning-border: #f0d89c;
            --warning-text: #8b6d3b;
            --shadow-sm: 0 1px 3px rgba(58, 53, 64, 0.05), 0 1px 2px rgba(58, 53, 64, 0.04);
            --shadow-md: 0 4px 16px rgba(58, 53, 64, 0.07), 0 2px 6px rgba(58, 53, 64, 0.04);
            --shadow-lg: 0 8px 30px rgba(58, 53, 64, 0.10), 0 3px 10px rgba(58, 53, 64, 0.05);
            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system,
                sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 15% 10%, rgba(91, 140, 158, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 90%, rgba(91, 140, 158, 0.03) 0%, transparent 55%);
            background-attachment: fixed;
        }
        /* 导航条 */
        .top-bar {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(58, 53, 64, 0.06);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-bar-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 7px 14px;
            border-radius: 20px;
            transition: var(--transition);
            background: var(--primary-light);
            white-space: nowrap;
        }
        .back-link:hover {
            background: #d4e6ef;
            color: #2c5668;
        }
        .scale-label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            text-align: right;
            letter-spacing: 0.02em;
            line-height: 1.3;
        }
        .scale-label small {
            display: block;
            font-weight: 400;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .page-header {
            text-align: center;
            padding: 32px 0 20px;
        }
        .page-header h1 {
            font-size: clamp(1.3rem, 2.5vw, 1.7rem);
            font-weight: 700;
            color: #2c2633;
            letter-spacing: 0.02em;
            margin-bottom: 6px;
        }
        .page-header .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }
        /* 进度条 */
        .progress-section {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(58, 53, 64, 0.05);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .progress-bar-outer {
            width: 100%;
            height: 8px;
            background: #e8e3ec;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #5b8c9e 0%, #7bafc0 100%);
            border-radius: 10px;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }
        /* 答题卡片 */
        .questions-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px 24px 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(58, 53, 64, 0.05);
            margin-bottom: 16px;
        }
        .question-item {
            padding: 14px 0;
            border-bottom: 1px solid #f0edf3;
            transition: var(--transition);
        }
        .question-item:last-child {
            border-bottom: none;
        }
        .question-item.answered {
            background: #fdfcfe;
            margin: 0 -16px;
            padding-left: 16px;
            padding-right: 16px;
            border-radius: 8px;
        }
        .question-num {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 0.75rem;
            width: 26px;
            height: 26px;
            line-height: 26px;
            text-align: center;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .question-text {
            font-weight: 500;
            font-size: 0.95rem;
            color: #2c2633;
            display: inline;
            letter-spacing: 0.02em;
            line-height: 1.5;
        }
        .reverse-badge {
            display: inline-block;
            background: #f2eef6;
            color: #7b6b8e;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .options-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .option-btn {
            flex: 1;
            min-width: 70px;
            padding: 10px 6px;
            border-radius: 22px;
            border: 1.5px solid #e0dbe4;
            background: #fff;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            text-align: center;
            font-family: var(--font-sans);
            letter-spacing: 0.02em;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .option-btn:hover {
            border-color: #c5bdd0;
            background: #faf9fb;
            color: var(--text);
        }
        .option-btn.selected {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            font-weight: 600;
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .option-desc {
            display: block;
            font-size: 0.6rem;
            font-weight: 400;
            opacity: 0.7;
            letter-spacing: 0.03em;
            margin-top: 2px;
        }
        .option-btn.selected .option-desc {
            opacity: 1;
        }
        /* 按钮区 */
        .nav-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 12px 28px;
            border-radius: 24px;
            border: 1.5px solid #d8d2de;
            background: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            transition: var(--transition);
            font-family: var(--font-sans);
            letter-spacing: 0.03em;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn:hover:not(:disabled) {
            border-color: #b8b0c0;
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f5f3f7;
        }
        .nav-btn.submit-btn {
            background: #3d5a4f;
            color: #fff;
            border-color: #3d5a4f;
            font-size: 0.95rem;
            padding: 14px 36px;
            letter-spacing: 0.04em;
        }
        .nav-btn.submit-btn:hover:not(:disabled) {
            background: #2f4840;
            border-color: #2f4840;
            box-shadow: var(--shadow-lg);
        }
        .nav-btn.clear-btn {
            color: var(--danger);
            border-color: #e8c8c0;
        }
        .nav-btn.clear-btn:hover:not(:disabled) {
            background: var(--danger-light);
            border-color: #d4a098;
        }
        /* 结果区域 */
        .results-section {
            display: none;
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 28px 24px 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(58, 53, 64, 0.06);
            margin-bottom: 32px;
        }
        .results-section.visible {
            display: block;
            animation: fadeInUp 0.45s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .results-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .results-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c2633;
            letter-spacing: 0.02em;
        }
        .results-header .result-date {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .result-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .result-stat {
            background: #faf8fc;
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            border: 1px solid #eeeaf2;
        }
        .result-stat .stat-val {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .result-stat .stat-lbl {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.03em;
        }
        .result-stat.warning .stat-val {
            color: var(--accent);
        }
        .result-level {
            text-align: center;
            margin: 16px 0;
            padding: 16px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.03em;
        }
        .result-level.normal {
            background: #e6f4ea;
            color: #3d6a4f;
        }
        .result-level.mild {
            background: #fef6e6;
            color: #8b6919;
        }
        .result-level.moderate {
            background: #fef0ea;
            color: #8b3d1f;
        }
        .result-level.severe {
            background: #fdecea;
            color: #8b1a1a;
        }
        .disclaimer {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            border-radius: var(--radius);
            padding: 14px 18px;
            font-size: 0.82rem;
            color: var(--warning-text);
            line-height: 1.6;
            margin-top: 16px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .disclaimer-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .crisis-alert {
            background: #fdecea;
            border: 2px solid #e8b4b0;
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-top: 16px;
            color: #8b1a1a;
            font-weight: 500;
            font-size: 0.85rem;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            line-height: 1.5;
        }
        .crisis-alert .crisis-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .footer {
            text-align: center;
            padding: 20px 20px 36px;
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.7;
            border-top: 1px solid rgba(58, 53, 64, 0.05);
        }
        .footer a {
            color: var(--primary-dark);
            text-decoration: none;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #3a3540;
            color: #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: var(--shadow-lg);
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(4px);
        }
        @media (max-width: 600px) {
            .questions-card {
                padding: 16px 12px 12px;
            }
            .question-item {
                padding: 10px 0;
            }
            .question-text {
                font-size: 0.85rem;
            }
            .option-btn {
                padding: 8px 4px;
                font-size: 0.72rem;
                min-width: 55px;
                border-radius: 18px;
            }
            .option-desc {
                font-size: 0.55rem;
            }
            .options-row {
                gap: 4px;
            }
            .nav-btn {
                padding: 10px 18px;
                font-size: 0.82rem;
            }
            .result-summary {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .result-stat {
                padding: 12px 8px;
            }
            .result-stat .stat-val {
                font-size: 1.4rem;
            }
            .top-bar-inner {
                padding: 0 10px;
                gap: 8px;
            }
            .back-link {
                font-size: 0.78rem;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="back-link" aria-label="返回量表目录">← 目录</a>
            <div class="scale-label">
                SDS 抑郁自评量表
                <small>Self-Rating Depression Scale</small>
            </div>
        </div>
    </header>

    <main class="container" id="mainContent">
        <div class="page-header">
            <h1>💙 SDS 抑郁自评量表</h1>
            <p class="subtitle">评估最近一周的情绪状态 · 共20题 · 约4-6分钟</p>
        </div>

        <!-- 进度区域 -->
        <div class="progress-section" id="progressSection">
            <div class="progress-info">
                <span id="progressLabel">请认真阅读每一条目，选择最符合你最近一周感受的选项</span>
                <span id="answeredCount">已答 0 题</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%;"></div>
            </div>
            <div style="font-size:0.7rem;color:var(--text-muted);margin-top:6px;">
                ⚡ 标注 <span class="reverse-badge">反向</span> 的题目计分方式与其它题目相反
            </div>
        </div>

        <!-- 答题卡片 -->
        <div class="questions-card" id="questionsCard"></div>

        <!-- 按钮 -->
        <div class="nav-buttons" id="navButtons">
            <button class="nav-btn clear-btn" id="btnClear">🔄 清空全部答案</button>
            <button class="nav-btn submit-btn" id="btnSubmit" disabled>✅ 提交答卷 · 查看结果</button>
        </div>

        <!-- 结果区域 -->
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>📊 测评结果报告</h2>
                <span class="result-date" id="resultDate"></span>
            </div>
            <div class="result-summary" id="resultSummary"></div>
            <div id="resultLevelContainer"></div>
            <div id="crisisAlertContainer"></div>
            <div class="disclaimer">
                <span class="disclaimer-icon">⚠️</span>
                <span><strong>重要提醒：</strong>本量表为自我筛查工具，结果仅供自我参考，<strong>不能替代专业心理医生的诊断</strong>。如果你对结果感到担忧，请咨询专业医生或拨打心理援助热线 <strong>12320-5</strong>。</span>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <button class="nav-btn" id="btnRetake">🔄 重新测评</button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <a href="index.html">← 返回量表目录</a> · 心灵驿站 - 心理测评中心
    </footer>

    <script>
        (function() {
            // SDS 题目数据 (20题)
            // reversed: true 表示反向计分题 (选项分值反转)
            const questions = [
                { id: 1, text: '我觉得闷闷不乐，情绪低沉', reversed: false },
                { id: 2, text: '我觉得一天之中早晨最好', reversed: true },
                { id: 3, text: '我一阵阵哭出来或觉得想哭', reversed: false },
                { id: 4, text: '我晚上睡眠不好', reversed: false },
                { id: 5, text: '我吃得跟平常一样多', reversed: true },
                { id: 6, text: '我与异性密切接触时和以往一样感到愉快', reversed: true },
                { id: 7, text: '我发觉我的体重在下降', reversed: false },
                { id: 8, text: '我有便秘的苦恼', reversed: false },
                { id: 9, text: '我心跳比平时快', reversed: false },
                { id: 10, text: '我无缘无故地感到疲乏', reversed: false },
                { id: 11, text: '我的头脑跟平常一样清楚', reversed: true },
                { id: 12, text: '我觉得经常做的事情并没有困难', reversed: true },
                { id: 13, text: '我觉得不安而平静不下来', reversed: false },
                { id: 14, text: '我对将来抱有希望', reversed: true },
                { id: 15, text: '我比平常容易生气激动', reversed: false },
                { id: 16, text: '我觉得作出决定是容易的', reversed: true },
                { id: 17, text: '我觉得自己是个有用的人，有人需要我', reversed: true },
                { id: 18, text: '我的生活过得很有意思', reversed: true },
                { id: 19, text: '我认为如果我死了别人会生活得好些', reversed: false },
                { id: 20, text: '平常感兴趣的事我仍然照样感兴趣', reversed: true },
            ];

            // 选项定义
            const optionLabels = [
                { label: '没有或很少时间', short: '很少', scoreForward: 1 },
                { label: '少部分时间', short: '有时', scoreForward: 2 },
                { label: '相当多时间', short: '经常', scoreForward: 3 },
                { label: '绝大部分或全部时间', short: '总是', scoreForward: 4 },
            ];

            // 状态管理
            let answers = {}; // { questionId: selectedScoreForward (1-4) }
            const saved = localStorage.getItem('sds_answers');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === 'object') answers = parsed;
                } catch (e) { answers = {}; }
            }

            // DOM 元素
            const questionsCard = document.getElementById('questionsCard');
            const progressBar = document.getElementById('progressBar');
            const answeredCountEl = document.getElementById('answeredCount');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnClear = document.getElementById('btnClear');
            const navButtons = document.getElementById('navButtons');
            const resultsSection = document.getElementById('resultsSection');
            const resultSummary = document.getElementById('resultSummary');
            const resultLevelContainer = document.getElementById('resultLevelContainer');
            const resultDate = document.getElementById('resultDate');
            const crisisAlertContainer = document.getElementById('crisisAlertContainer');
            const btnRetake = document.getElementById('btnRetake');
            const toast = document.getElementById('toast');
            const progressSection = document.getElementById('progressSection');

            let toastTimer;
            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function saveAnswers() {
                localStorage.setItem('sds_answers', JSON.stringify(answers));
            }

            // 获取实际计分分数 (考虑反向)
            function getRealScore(q, selectedForwardScore) {
                if (q.reversed) {
                    // 反向计分：选1得4，选2得3，选3得2，选4得1
                    return 5 - selectedForwardScore;
                }
                return selectedForwardScore;
            }

            // 渲染全部题目
            function renderQuestions() {
                let html = '';
                questions.forEach(q => {
                    const selectedForward = answers[q.id]; // 存储的是正向选项分数(1-4)
                    const answeredClass = selectedForward !== undefined ? ' answered' : '';
                    const reverseBadge = q.reversed ? '<span class="reverse-badge">反向</span>' : '';
                    html += `<div class="question-item${answeredClass}" id="q-item-${q.id}">`;
                    html +=
                        `<span class="question-num">${q.id}</span><span class="question-text">${q.text}${reverseBadge}</span>`;
                    html += `<div class="options-row" data-qid="${q.id}">`;
                    optionLabels.forEach(opt => {
                        const scoreFwd = opt.scoreForward;
                        const selClass = (selectedForward === scoreFwd) ? ' selected' : '';
                        html += `
                                <button class="option-btn${selClass}" data-score="${scoreFwd}" data-qid="${q.id}"
                                    aria-label="${opt.label}" title="${opt.label}">
                                    ${opt.short}
                                    <span class="option-desc">${opt.label}</span>
                                </button>`;
                    });
                    html += `</div></div>`;
                });
                questionsCard.innerHTML = html;

                // 绑定选项点击
                questionsCard.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const qid = parseInt(this.getAttribute('data-qid'));
                        const scoreFwd = parseInt(this.getAttribute('data-score'));
                        if (answers[qid] === scoreFwd) {
                            delete answers[qid];
                        } else {
                            answers[qid] = scoreFwd;
                        }
                        saveAnswers();
                        renderQuestions();
                        updateProgress();
                    });
                });
                updateProgress();
            }

            function updateProgress() {
                const total = questions.length;
                const answered = Object.keys(answers).length;
                const pct = Math.round((answered / total) * 100);
                progressBar.style.width = pct + '%';
                answeredCountEl.textContent = `已答 ${answered} 题`;
                btnSubmit.disabled = answered < total;
                if (answered === total) {
                    btnSubmit.disabled = false;
                }
            }

            // 清空全部答案
            function clearAll() {
                if (Object.keys(answers).length === 0) {
                    showToast('暂无已选答案');
                    return;
                }
                if (confirm('确定要清空全部已选答案吗？此操作不可恢复。')) {
                    answers = {};
                    saveAnswers();
                    renderQuestions();
                    updateProgress();
                    showToast('已清空全部答案');
                }
            }

            // 提交并计算结果
            function submitAndShow() {
                const total = questions.length;
                const answered = Object.keys(answers).length;
                if (answered < total) {
                    showToast(`还有 ${total - answered} 题未回答，请完成全部题目`);
                    return;
                }
                // 计算原始总分 (实际计分)
                let rawScore = 0;
                questions.forEach(q => {
                    const fwdScore = answers[q.id];
                    rawScore += getRealScore(q, fwdScore);
                });
                // 标准分 = 原始分 * 1.25 四舍五入取整
                const standardScore = Math.round(rawScore * 1.25);

                // 分级
                let levelText, levelClass;
                if (standardScore < 50) {
                    levelText = '正常范围';
                    levelClass = 'normal';
                } else if (standardScore <= 59) {
                    levelText = '轻度抑郁';
                    levelClass = 'mild';
                } else if (standardScore <= 69) {
                    levelText = '中度抑郁';
                    levelClass = 'moderate';
                } else {
                    levelText = '重度抑郁';
                    levelClass = 'severe';
                }

                // 显示结果区
                resultsSection.classList.add('visible');
                resultDate.textContent = `测评时间：${new Date().toLocaleString('zh-CN')}`;
                const warning = standardScore >= 50;
                resultSummary.innerHTML = `
                        <div class="result-stat ${warning ? 'warning' : ''}">
                            <div class="stat-val">${rawScore}</div>
                            <div class="stat-lbl">原始总分 (20-80)</div>
                        </div>
                        <div class="result-stat ${warning ? 'warning' : ''}">
                            <div class="stat-val">${standardScore}</div>
                            <div class="stat-lbl">标准分 (原始分×1.25)</div>
                        </div>
                    `;
                resultLevelContainer.innerHTML = `
                        <div class="result-level ${levelClass}">
                            ${levelText}
                        </div>
                    `;

                // 危机预警：第19题（我认为如果我死了别人会生活得好些）得分偏高
                const q19Fwd = answers[19];
                let crisisHTML = '';
                if (q19Fwd && q19Fwd >= 3) {
                    crisisHTML = `
                            <div class="crisis-alert">
                                <span class="crisis-icon">🆘</span>
                                <div>
                                    <strong>危机提醒：</strong>你在涉及生命意义的题目上得分较高，如果你正在经历情绪困扰或有伤害自己的想法，请<strong>立即</strong>寻求帮助。<br>
                                    📞 <strong>全国心理援助热线：12320-5</strong>　|　📞 <strong>北京心理危机干预中心：010-82951332</strong>
                                </div>
                            </div>`;
                }
                crisisAlertContainer.innerHTML = crisisHTML;

                // 屏蔽答题区操作
                progressSection.style.opacity = '0.5';
                questionsCard.style.opacity = '0.5';
                navButtons.style.opacity = '0.5';
                questionsCard.style.pointerEvents = 'none';
                navButtons.style.pointerEvents = 'none';

                // 保存
                saveAnswers();
                // 滚动到结果
                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                window.scrollBy(0, -60);
            }

            // 重新测评
            function retakeTest() {
                if (confirm('确定要清除所有答案并重新测评吗？')) {
                    answers = {};
                    localStorage.removeItem('sds_answers');
                    resultsSection.classList.remove('visible');
                    progressSection.style.opacity = '1';
                    questionsCard.style.opacity = '1';
                    navButtons.style.opacity = '1';
                    questionsCard.style.pointerEvents = 'auto';
                    navButtons.style.pointerEvents = 'auto';
                    crisisAlertContainer.innerHTML = '';
                    resultLevelContainer.innerHTML = '';
                    renderQuestions();
                    updateProgress();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }

            // 事件绑定
            btnClear.addEventListener('click', clearAll);
            btnSubmit.addEventListener('click', submitAndShow);
            btnRetake.addEventListener('click', retakeTest);

            // 初始渲染
            renderQuestions();
            updateProgress();

            console.log('💙 SDS 抑郁自评量表已就绪 · 20题 · 反向计分题已标注');
        })();
    </script>
</body>
</html>
