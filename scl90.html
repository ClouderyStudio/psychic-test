<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCL-90 症状自评量表 - 心灵驿站</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* SCL-90 独有样式 */
        .page-indicator {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 8px;
            justify-content: center;
        }
        .page-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d8d2de;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            padding: 0;
        }
        .page-dot.completed {
            background: #a0c4d1;
        }
        .page-dot.active {
            background: var(--primary);
            width: 22px;
            border-radius: 10px;
        }
        .questions-card {
            min-height: 300px;
        }
        .option-score {
            display: block;
            font-size: 0.65rem;
            font-weight: 400;
            opacity: 0.75;
            letter-spacing: 0.04em;
        }
        .option-btn.selected .option-score {
            opacity: 1;
        }
        .nav-buttons {
            justify-content: space-between;
        }
        .nav-btn.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .nav-btn.primary:hover:not(:disabled) {
            background: #4a7d8f;
            border-color: #4a7d8f;
        }
        .nav-btn.danger {
            background: #fff;
            color: var(--danger);
            border-color: #e8c8c0;
        }
        .nav-btn.danger:hover:not(:disabled) {
            background: var(--danger-light);
            border-color: #d4a098;
        }
        .factor-table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 16px;
        }
        .factor-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 560px;
        }
        .factor-table th,
        .factor-table td {
            padding: 9px 10px;
            text-align: center;
            border-bottom: 1px solid #f0edf3;
            letter-spacing: 0.02em;
        }
        .factor-table th {
            background: #faf8fc;
            font-weight: 700;
            color: #4a4254;
            font-size: 0.73rem;
            letter-spacing: 0.04em;
            position: sticky;
            top: 0;
        }
        .factor-table .factor-name {
            text-align: left;
            font-weight: 600;
            color: #2c2633;
            white-space: nowrap;
        }
        .level-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .level-badge.normal { background: #e6f4ea; color: #3d6a4f; }
        .level-badge.mild { background: #fef6e6; color: #8b6919; }
        .level-badge.moderate { background: #fef0ea; color: #8b3d1f; }
        .level-badge.severe { background: #fdecea; color: #8b1a1a; }
        .crisis-alert {
            animation: subtlePulse 2s ease-in-out infinite;
        }
        @keyframes subtlePulse {
            0%, 100% { border-color: #e8b4b0; }
            50% { border-color: #d4857f; }
        }
        .disclaimer {
            margin-top: 16px;
        }
        @media (max-width: 600px) {
            .option-btn { min-width: 48px; }
            .option-score { font-size: 0.6rem; }
            .factor-table { font-size: 0.7rem; min-width: 480px; }
            .factor-table th, .factor-table td { padding: 6px 6px; }
            .scale-label { font-size: 0.78rem; }
            .scale-label small { font-size: 0.65rem; }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="back-link" aria-label="返回量表目录">← 目录</a>
            <div class="scale-label">
                SCL-90 症状自评量表
                <small>Symptom Checklist 90</small>
            </div>
        </div>
    </header>

    <main class="container" id="mainContent">
        <div class="page-header">
            <h1>🧠 SCL-90 症状自评量表</h1>
            <p class="subtitle">评估最近一周的心理健康状况 · 共90题 · 约15-20分钟</p>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-info">
                <span id="progressLabel">第 1 页 / 共 9 页</span>
                <span id="answeredCount">已答 0 题</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width:0%;"></div>
            </div>
            <div class="page-indicator" id="pageDots"></div>
        </div>

        <div class="questions-card" id="questionsCard"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="nav-btn" id="btnPrev" disabled>← 上一页</button>
            <button class="nav-btn danger" id="btnClear" title="清空当前页答案">🔄 清空本页</button>
            <button class="nav-btn primary" id="btnNext">下一页 →</button>
        </div>
        <div class="nav-buttons" id="submitRow" style="justify-content:center; display:none;">
            <button class="nav-btn submit-btn" id="btnSubmit" disabled>✅ 提交答卷 · 查看结果</button>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>📊 测评结果报告</h2>
                <span class="result-date" id="resultDate"></span>
            </div>
            <div class="result-summary" id="resultSummary"></div>
            <div class="factor-table-wrap">
                <table class="factor-table" id="factorTable"></table>
            </div>
            <div id="crisisAlertContainer"></div>
            <div class="disclaimer">
                <span class="disclaimer-icon">⚠️</span>
                <span><strong>重要提醒：</strong>本量表为自我筛查工具，结果仅供自我参考，<strong>不能替代专业心理医生的诊断</strong>。如果你对结果感到担忧，请咨询专业医生或拨打心理援助热线 <strong>12320-5</strong>。</span>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <button class="nav-btn" id="btnRetake" style="margin:0 auto;">🔄 重新测评</button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <a href="index.html">← 返回量表目录</a> · 心灵驿站 - 心理测评中心
    </footer>

    <script src="common.js"></script>
    <script>
        (function() {

                { id: 59, text: '想到死亡的事', factor: '其他' },
                { id: 60, text: '吃得太多', factor: '其他' },
                { id: 61, text: '当别人看着你或谈论你时感到不自在', factor: '人际关系敏感' },

                { id: 67, text: '有想摔坏或破坏东西的冲动', factor: '敌对' },
                { id: 68, text: '有一些别人没有的想法或念头', factor: '偏执' },
                { id: 69, text: '感到对别人神经过敏', factor: '人际关系敏感' },
                { id: 70, text: '在商店或电影院等人多的地方感到不自在', factor: '恐怖' },
                { id: 71, text: '感到任何事情都很困难', factor: '忧郁' },
                { id: 72, text: '一阵阵恐惧或惊恐', factor: '焦虑' },
                { id: 73, text: '感到在公共场合吃东西很不舒服', factor: '人际关系敏感' },
                { id: 74, text: '经常与人争论', factor: '敌对' },
                { id: 75, text: '单独一人时神经很紧张', factor: '恐怖' },
                { id: 76, text: '别人对你的成绩没有作出恰当的评价', factor: '偏执' },
                { id: 77, text: '即使和别人在一起也感到孤单', factor: '精神病性' },
                { id: 78, text: '感到坐立不安心神不定', factor: '焦虑' },
                { id: 79, text: '感到自己没有什么价值', factor: '忧郁' },
                { id: 80, text: '感到熟悉的东西变得陌生或不像是真的', factor: '焦虑' },
                { id: 81, text: '大叫或摔东西', factor: '敌对' },
                { id: 82, text: '害怕会在公共场合晕倒', factor: '恐怖' },
                { id: 83, text: '感到别人想占你的便宜', factor: '偏执' },
                { id: 84, text: '为一些有关"性"的想法而很苦恼', factor: '精神病性' },
                { id: 85, text: '你认为应该因为自己的过错而受到惩罚', factor: '精神病性' },
                { id: 86, text: '感到要赶快把事情做完', factor: '焦虑' },
                { id: 87, text: '感到自己的身体有严重问题', factor: '精神病性' },
                { id: 88, text: '从未感到和其他人很亲近', factor: '精神病性' },
                { id: 89, text: '感到自己有罪', factor: '其他' },
                { id: 90, text: '感到自己的脑子有毛病', factor: '精神病性' },
            ];

            // ==================== 因子定义 ====================
            var factorDefs = [
                { name: '躯体化', items: [1, 4, 12, 27, 40, 42, 48, 49, 52, 53, 56, 58] },
                { name: '强迫症状', items: [3, 9, 10, 28, 38, 45, 46, 51, 55, 65] },
                { name: '人际关系敏感', items: [6, 21, 34, 36, 37, 41, 61, 69, 73] },
                { name: '忧郁', items: [5, 14, 15, 20, 22, 26, 29, 30, 31, 32, 54, 71, 79] },
                { name: '焦虑', items: [2, 17, 23, 33, 39, 57, 72, 78, 80, 86] },
                { name: '敌对', items: [11, 24, 63, 67, 74, 81] },
                { name: '恐怖', items: [13, 25, 47, 50, 70, 75, 82] },
                { name: '偏执', items: [8, 18, 43, 68, 76, 83] },
                { name: '精神病性', items: [7, 16, 35, 62, 77, 84, 85, 87, 88, 90] },
                { name: '其他（睡眠饮食）', items: [19, 44, 59, 60, 64, 66, 89] },
            ];

            var QUESTIONS_PER_PAGE = 10;
            var TOTAL_PAGES = Math.ceil(questions.length / QUESTIONS_PER_PAGE);

            // ==================== 状态 ====================
            var answers = {};
            var currentPage = 1;

            var savedData = localStorage.getItem('scl90_answers');
            if (savedData) {
                try {
                    var parsed = JSON.parse(savedData);
                    if (parsed && typeof parsed === 'object') answers = parsed;
                } catch (e) { answers = {}; }
            }

            // ==================== DOM ====================
            var questionsCard = document.getElementById('questionsCard');
            var progressBar = document.getElementById('progressBar');
            var progressLabel = document.getElementById('progressLabel');
            var answeredCountEl = document.getElementById('answeredCount');
            var pageDotsEl = document.getElementById('pageDots');
            var btnPrev = document.getElementById('btnPrev');
            var btnNext = document.getElementById('btnNext');
            var btnClear = document.getElementById('btnClear');
            var btnSubmit = document.getElementById('btnSubmit');
            var submitRow = document.getElementById('submitRow');
            var navButtons = document.getElementById('navButtons');
            var resultsSection = document.getElementById('resultsSection');
            var resultSummary = document.getElementById('resultSummary');
            var factorTable = document.getElementById('factorTable');
            var resultDate = document.getElementById('resultDate');
            var crisisAlertContainer = document.getElementById('crisisAlertContainer');
            var btnRetake = document.getElementById('btnRetake');
            var toast = document.getElementById('toast');
            var progressSection = document.getElementById('progressSection');

            var toastTimer;

            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2000);
            }

            function saveAnswers() {
                localStorage.setItem('scl90_answers', JSON.stringify(answers));
            }

            function renderPageDots() {
                var html = '';
                for (var i = 1; i <= TOTAL_PAGES; i++) {
                    var cls = 'page-dot';
                    if (i === currentPage) cls += ' active';
                    var pageStart = (i - 1) * QUESTIONS_PER_PAGE;
                    var pageEnd = Math.min(i * QUESTIONS_PER_PAGE, questions.length);
                    var hasAnswer = false;
                    for (var j = pageStart; j < pageEnd; j++) {
                        if (answers[questions[j].id] !== undefined) { hasAnswer = true; break; }
                    }
                    if (hasAnswer && i !== currentPage) cls += ' completed';
                    html += '<button class="' + cls + '" data-page="' + i + '" aria-label="跳转到第' + i + '页" title="第' + i + '页"></button>';
                }
                pageDotsEl.innerHTML = html;

                var dots = pageDotsEl.querySelectorAll('.page-dot');
                for (var k = 0; k < dots.length; k++) {
                    (function(dot) {
                        dot.addEventListener('click', function() {
                            var targetPage = parseInt(this.getAttribute('data-page'));
                            if (targetPage !== currentPage) {
                                currentPage = targetPage;
                                renderCurrentPage();
                                scrollToQuestions();
                            }
                        });
                    })(dots[k]);
                }
            }

            function scrollToQuestions() {
                questionsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                window.scrollBy(0, -80);
            }

            function updateProgress() {
                var totalAnswered = Object.keys(answers).length;
                var progressPercent = Math.round((totalAnswered / questions.length) * 100);
                progressBar.style.width = progressPercent + '%';
                answeredCountEl.textContent = '已答 ' + totalAnswered + ' 题';
                progressLabel.textContent = '第 ' + currentPage + ' 页 / 共 ' + TOTAL_PAGES + ' 页';

                btnPrev.disabled = currentPage === 1;
                if (currentPage === TOTAL_PAGES) {
                    btnNext.style.display = 'none';
                    submitRow.style.display = 'flex';
                } else {
                    btnNext.style.display = '';
                    submitRow.style.display = 'none';
                }
                btnSubmit.disabled = totalAnswered < questions.length;

                renderPageDots();
            }

            function renderCurrentPage() {
                var startIdx = (currentPage - 1) * QUESTIONS_PER_PAGE;
                var endIdx = Math.min(startIdx + QUESTIONS_PER_PAGE, questions.length);
                var pageQuestions = questions.slice(startIdx, endIdx);

                var optionLabels = ['无', '轻度', '中度', '偏重', '严重'];
                var optionScores = [1, 2, 3, 4, 5];

                var html = '';
                for (var i = 0; i < pageQuestions.length; i++) {
                    var q = pageQuestions[i];
                    var qNum = q.id;
                    var selectedVal = answers[qNum];
                    var answeredClass = selectedVal !== undefined ? ' answered' : '';
                    html += '<div class="question-item' + answeredClass + '">';
                    html += '<span class="question-num">' + qNum + '</span><span class="question-text">' + q.text + '</span>';
                    html += '<div class="options-row" data-qid="' + qNum + '">';
                    for (var j = 0; j < optionLabels.length; j++) {
                        var score = optionScores[j];
                        var selClass = (selectedVal === score) ? ' selected' : '';
                        html += '<button class="option-btn' + selClass + '" data-score="' + score + '" data-qid="' + qNum + '"';
                        html += ' aria-label="' + optionLabels[j] + ' (' + score + '分)" title="' + optionLabels[j] + '">';
                        html += optionLabels[j] + '<span class="option-score">' + score + '分</span></button>';
                    }
                    html += '</div></div>';
                }

                questionsCard.innerHTML = html;
                questionsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                window.scrollBy(0, -70);

                var btns = questionsCard.querySelectorAll('.option-btn');
                for (var k = 0; k < btns.length; k++) {
                    (function(btn) {
                        btn.addEventListener('click', function() {
                            var qid = parseInt(this.getAttribute('data-qid'));
                            var score = parseInt(this.getAttribute('data-score'));
                            if (answers[qid] === score) { delete answers[qid]; }
                            else { answers[qid] = score; }
                            saveAnswers();
                            renderCurrentPage();
                            updateProgress();
                        });
                    })(btns[k]);
                }

                updateProgress();
            }

            function clearCurrentPage() {
                var startIdx = (currentPage - 1) * QUESTIONS_PER_PAGE;
                var endIdx = Math.min(startIdx + QUESTIONS_PER_PAGE, questions.length);
                var cleared = false;
                for (var i = startIdx; i < endIdx; i++) {
                    if (answers[questions[i].id] !== undefined) {
                        delete answers[questions[i].id];
                        cleared = true;
                    }
                }
                if (cleared) {
                    saveAnswers();
                    showToast('已清空本页答案');
                } else {
                    showToast('本页暂无已选答案');
                }
                renderCurrentPage();
                updateProgress();
            }

            function calcFactorScores() {
                var factorResults = [];
                for (var f = 0; f < factorDefs.length; f++) {
                    var fd = factorDefs[f];
                    var sum = 0;
                    var count = 0;
                    for (var i = 0; i < fd.items.length; i++) {
                        var qid = fd.items[i];
                        if (answers[qid] !== undefined) {
                            sum += answers[qid];
                            count++;
                        }
                    }
                    var avg = count > 0 ? sum / count : 0;
                    factorResults.push({ name: fd.name, sum: sum, count: count, avg: avg, totalItems: fd.items.length });
                }
                return factorResults;
            }

            function getLevelName(avg) {
                if (avg < 2) return { level: '正常', cls: 'normal' };
                if (avg < 3) return { level: '轻度', cls: 'mild' };
                if (avg < 4) return { level: '中度', cls: 'moderate' };
                return { level: '重度', cls: 'severe' };
            }

            function submitAndShowResults() {
                var totalAnswered = Object.keys(answers).length;
                if (totalAnswered < questions.length) {
                    showToast('还有 ' + (questions.length - totalAnswered) + ' 题未回答，请完成全部题目');
                    return;
                }

                var totalScore = 0;
                for (var i = 0; i < questions.length; i++) {
                    totalScore += (answers[questions[i].id] || 0);
                }
                var totalAvg = totalScore / questions.length;

                var positiveCount = 0;
                var positiveSum = 0;
                for (var i = 0; i < questions.length; i++) {
                    var score = answers[questions[i].id] || 0;
                    if (score >= 2) { positiveCount++; positiveSum += score; }
                }
                var positiveAvg = positiveCount > 0 ? positiveSum / positiveCount : 0;

                var factorResults = calcFactorScores();

                resultsSection.classList.add('visible');
                resultDate.textContent = '测评时间：' + new Date().toLocaleString('zh-CN');

                var totalWarning = totalScore > 160 || positiveCount > 43;

                resultSummary.innerHTML =
                    '<div class="result-stat ' + (totalWarning ? 'warning' : '') + '">' +
                        '<div class="stat-val">' + totalScore + '</div><div class="stat-lbl">总分 (90-450)</div>' +
                    '</div>' +
                    '<div class="result-stat">' +
                        '<div class="stat-val">' + totalAvg.toFixed(2) + '</div><div class="stat-lbl">总均分</div>' +
                    '</div>' +
                    '<div class="result-stat ' + (totalWarning ? 'warning' : '') + '">' +
                        '<div class="stat-val">' + positiveCount + '</div><div class="stat-lbl">阳性项目数 (≥2分)</div>' +
                    '</div>' +
                    '<div class="result-stat">' +
                        '<div class="stat-val">' + positiveAvg.toFixed(2) + '</div><div class="stat-lbl">阳性症状均分</div>' +
                    '</div>';

                var tableHTML =
                    '<thead><tr>' +
                        '<th>因子</th><th>题目数</th><th>因子总分</th><th>因子均分</th><th>程度</th>' +
                    '</tr></thead><tbody>';
                for (var f = 0; f < factorResults.length; f++) {
                    var fr = factorResults[f];
                    var levelInfo = getLevelName(fr.avg);
                    tableHTML +=
                        '<tr>' +
                            '<td class="factor-name">' + fr.name + '</td>' +
                            '<td>' + fr.totalItems + '</td>' +
                            '<td>' + fr.sum.toFixed(0) + '</td>' +
                            '<td><strong>' + fr.avg.toFixed(2) + '</strong></td>' +
                            '<td><span class="level-badge ' + levelInfo.cls + '">' + levelInfo.level + '</span></td>' +
                        '</tr>';
                }
                tableHTML += '</tbody>';
                factorTable.innerHTML = tableHTML;

                // 危机预警
                var q15Score = answers[15] || 0;
                var q59Score = answers[59] || 0;
                var crisisHTML = '';
                if (q15Score >= 3 || q59Score >= 4) {
                    crisisHTML =
                        '<div class="crisis-alert">' +
                            '<span class="crisis-icon">🆘</span>' +
                            '<div>' +
                                '<strong>危机提醒：</strong>你在涉及生命意愿或死亡相关题目上得分较高。' +
                                '如果你正在经历严重的情绪困扰或有伤害自己的想法，请<strong>立即</strong>寻求帮助。<br>' +
                                '📞 <strong>全国心理援助热线：12320-5</strong>　|　📞 <strong>北京心理危机干预中心：010-82951332</strong><br>' +
                                '你并不孤单，专业的帮助随时可用。' +
                            '</div>' +
                        '</div>';
                } else if (q15Score >= 2) {
                    crisisHTML =
                        '<div class="crisis-alert" style="background:#fef9f0;border-color:#f0d89c;color:#8b6d3b;animation:none;">' +
                            '<span class="crisis-icon">⚠️</span>' +
                            '<div>' +
                                '<strong>请留意：</strong>你在涉及生命意愿的题目上有一定程度的得分。建议你关注自己的情绪状态，' +
                                '与信任的人交流感受，必要时寻求心理咨询帮助。' +
                            '</div>' +
                        '</div>';
                }
                crisisAlertContainer.innerHTML = crisisHTML;

                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                window.scrollBy(0, -60);

                progressSection.style.opacity = '0.5';
                questionsCard.style.opacity = '0.5';
                navButtons.style.opacity = '0.5';
                submitRow.style.opacity = '0.5';
                questionsCard.style.pointerEvents = 'none';
                navButtons.style.pointerEvents = 'none';
                submitRow.style.pointerEvents = 'none';

                saveAnswers();
            }

            function retakeTest() {
                if (confirm('确定要清除所有答案并重新测评吗？此操作不可恢复。')) {
                    answers = {};
                    currentPage = 1;
                    localStorage.removeItem('scl90_answers');
                    resultsSection.classList.remove('visible');
                    progressSection.style.opacity = '1';
                    questionsCard.style.opacity = '1';
                    navButtons.style.opacity = '1';
                    submitRow.style.opacity = '1';
                    questionsCard.style.pointerEvents = 'auto';
                    navButtons.style.pointerEvents = 'auto';
                    submitRow.style.pointerEvents = 'auto';
                    crisisAlertContainer.innerHTML = '';
                    renderCurrentPage();
                    updateProgress();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }

            // 事件绑定
            btnPrev.addEventListener('click', function() {
                if (currentPage > 1) { currentPage--; renderCurrentPage(); scrollToQuestions(); }
            });
            btnNext.addEventListener('click', function() {
                if (currentPage < TOTAL_PAGES) { currentPage++; renderCurrentPage(); scrollToQuestions(); }
            });
            btnClear.addEventListener('click', clearCurrentPage);
            btnSubmit.addEventListener('click', submitAndShowResults);
            btnRetake.addEventListener('click', retakeTest);

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                if (resultsSection.classList.contains('visible')) return;
                if (e.key === 'ArrowLeft' && !e.target.closest('input,textarea')) {
                    e.preventDefault();
                    if (currentPage > 1) { currentPage--; renderCurrentPage(); scrollToQuestions(); }
                }
                if (e.key === 'ArrowRight' && !e.target.closest('input,textarea')) {
                    e.preventDefault();
                    if (currentPage < TOTAL_PAGES) { currentPage++; renderCurrentPage(); scrollToQuestions(); }
                }
            });

            // 初始渲染
            renderCurrentPage();
            updateProgress();

            if (Object.keys(answers).length === questions.length && currentPage === TOTAL_PAGES) {
                btnSubmit.disabled = false;
            }

            console.log('🧠 SCL-90 症状自评量表已就绪');
            console.log('   共 ' + questions.length + ' 题 · ' + TOTAL_PAGES + ' 页 · 每页' + QUESTIONS_PER_PAGE + '题');
            console.log('   评分：1-无 2-轻度 3-中度 4-偏重 5-严重');
            console.log('   💡 提示：使用键盘 ← → 方向键可翻页');
        })();
    </script>
</body>
</html>
